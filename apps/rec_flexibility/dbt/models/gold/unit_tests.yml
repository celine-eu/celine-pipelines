          - {community_id: 'example-rec', device_id: 'dev-base', baseline_type: 'shift_potential', slot: 36, is_weekday: false, baseline_kwh: 0.05}
          - {community_id: 'example-rec', device_id: 'dev-base', baseline_type: 'shift_potential', slot: 37, is_weekday: false, baseline_kwh: 0.05}
          - {community_id: 'example-rec', device_id: 'dev-base', baseline_type: 'shift_potential', slot: 38, is_weekday: false, baseline_kwh: 0.05}
          - {community_id: 'example-rec', device_id: 'dev-base', baseline_type: 'shift_potential', slot: 39, is_weekday: false, baseline_kwh: 0.05}
          - {community_id: 'example-rec', device_id: 'dev-base', baseline_type: 'shift_potential', slot: 40, is_weekday: false, baseline_kwh: 0.05}
          - {community_id: 'example-rec', device_id: 'dev-base', baseline_type: 'shift_potential', slot: 41, is_weekday: false, baseline_kwh: 0.05}
          - {community_id: 'example-rec', device_id: 'dev-base', baseline_type: 'shift_potential', slot: 42, is_weekday: false, baseline_kwh: 0.05}
          - {community_id: 'example-rec', device_id: 'dev-base', baseline_type: 'shift_potential', slot: 43, is_weekday: false, baseline_kwh: 0.05}
      - input: source('meters_gold', 'meters_energy_forecast')
