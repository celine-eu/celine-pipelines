        - {device_id: 'dev-c', community_id: 'small', is_in_app: true, category: 'household'}

  - name: r3_has_export_register_only_for_cf2_cf4
    description: CF2/CF4 meters carry an export register; CF1/CF3 do not. Quarantine columns pass through.
    model: rec_fair_device_registry
