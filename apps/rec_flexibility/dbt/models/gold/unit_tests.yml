  # ─────────────────────────────────────────────────────────────────────────────
  # rec_fair_weekly_metrics (fair gamification §4.4 Livello / Crescita inputs)
  # Weeks pinned with fair_as_of; daily fixtures generated in SQL.
  # ─────────────────────────────────────────────────────────────────────────────

  - name: m1_growth_windows_grow_with_valid_weeks
    description: >
      8 valid weeks (Aug 10 … Sep 28) with night import per day 1,1,1,1,0.8,0.8,0.6,0.6 kWh:
      growth_n is null until the 4th valid week, then 2,2,3,3,4; deltas 0, −0.1, −0.133333, −0.266667, −0.3.
    model: rec_fair_weekly_metrics
    overrides:
      vars: {fair_as_of: '2026-10-09', fair_recompute_weeks: 8, fair_history_start: '2026-08-10'}
      macros:
        is_incremental: false
    given:
      - input: ref('rec_fair_daily')
        format: sql
        rows: |
          select 'd1' as device_id, 'rec' as community_id, d::date as local_day, 96 as n_slots, true as is_valid_day,
                 10.0::double precision as import_kwh, 0.0::double precision as export_kwh,
                 (array[1.0,1.0,1.0,1.0,0.8,0.8,0.6,0.6])[((d::date - date '2026-08-10') / 7) + 1]::double precision as night_import_kwh,
                 36 as night_slots, 1.0::double precision as midday_import_kwh
          from generate_series(date '2026-08-10', date '2026-10-04', interval '1 day') as d
      - input: ref('rec_fair_community_days')
        rows: []
      - input: ref('rec_fair_device_class')
        format: sql
        rows: |
          select 'd1' as device_id, 'rec' as community_id, w::date as week_start, 'no_pv' as pv_class, 'household' as category,
                 'household/no_pv' as ref_group, false as is_quarantined, true as is_rankable
          from generate_series(date '2026-08-10', date '2026-09-28', interval '7 days') as w
    expect:
      rows:
        - {device_id: 'd1', week_start: '2026-08-10', valid_days: 7, is_valid_week: true, growth_n: null, growth_delta: null}
        - {device_id: 'd1', week_start: '2026-08-17', valid_days: 7, is_valid_week: true, growth_n: null, growth_delta: null}
        - {device_id: 'd1', week_start: '2026-08-24', valid_days: 7, is_valid_week: true, growth_n: null, growth_delta: null}
        - {device_id: 'd1', week_start: '2026-08-31', valid_days: 7, is_valid_week: true, growth_n: 2, growth_delta: 0.0}
        - {device_id: 'd1', week_start: '2026-09-07', valid_days: 7, is_valid_week: true, growth_n: 2, growth_delta: -0.1}
        - {device_id: 'd1', week_start: '2026-09-14', valid_days: 7, is_valid_week: true, growth_n: 3, growth_delta: -0.133333}
        - {device_id: 'd1', week_start: '2026-09-21', valid_days: 7, is_valid_week: true, growth_n: 3, growth_delta: -0.266667}
        - {device_id: 'd1', week_start: '2026-09-28', valid_days: 7, is_valid_week: true, growth_n: 4, growth_delta: -0.3}

  - name: m4_pv_level_carries_forward_two_weeks_then_none
    description: PV device, cloudy valid days per week 3,0,0,0 → cloudy_days, carry_forward ×2 (1, 2 weeks), then no_cloudy_days with no Level.
    model: rec_fair_weekly_metrics
    overrides:
      vars: {fair_as_of: '2026-10-09', fair_recompute_weeks: 4, fair_history_start: '2026-09-07'}
      macros:
        is_incremental: false
    given:
      - input: ref('rec_fair_daily')
        format: sql
        rows: |
          select 'p1' as device_id, 'rec' as community_id, d::date as local_day, 96 as n_slots, true as is_valid_day,
                 10.0::double precision as import_kwh, 5.0::double precision as export_kwh, 4.0::double precision as night_import_kwh,
                 36 as night_slots, 1.0::double precision as midday_import_kwh
          from generate_series(date '2026-09-07', date '2026-10-04', interval '1 day') as d
      - input: ref('rec_fair_community_days')
        format: sql
        rows: |
          select 'rec' as community_id, d::date as local_day, (d::date < date '2026-09-10') as is_cloudy
          from generate_series(date '2026-09-07', date '2026-10-04', interval '1 day') as d
      - input: ref('rec_fair_device_class')
        format: sql
        rows: |
          select 'p1' as device_id, 'rec' as community_id, w::date as week_start, 'pv' as pv_class, 'household' as category,
                 'household/pv' as ref_group, false as is_quarantined, true as is_rankable
          from generate_series(date '2026-09-07', date '2026-09-28', interval '7 days') as w
    expect:
      rows:
        - {device_id: 'p1', week_start: '2026-09-07', cloudy_valid_days: 3, level_metric: 0.4, level_source: 'cloudy_days', level_carry_weeks: 0}
        - {device_id: 'p1', week_start: '2026-09-14', cloudy_valid_days: 0, level_metric: 0.4, level_source: 'carry_forward', level_carry_weeks: 1}
        - {device_id: 'p1', week_start: '2026-09-21', cloudy_valid_days: 0, level_metric: 0.4, level_source: 'carry_forward', level_carry_weeks: 2}
        - {device_id: 'p1', week_start: '2026-09-28', cloudy_valid_days: 0, level_metric: null, level_source: 'no_cloudy_days', level_carry_weeks: null}

  - name: m6_night_kwh_h_uses_night_slots_and_invalid_week_no_level
    description: >
      Week with a 40-slot night (DST day): 7 × 0.9 kWh over 256 night quarters = 6.3 / 64 h = 0.098438 kWh/h.
      A week with only 4 valid days is invalid: no Level ('no_valid_week').
    model: rec_fair_weekly_metrics
    overrides:
      vars: {fair_as_of: '2026-10-09', fair_recompute_weeks: 2, fair_history_start: '2026-09-21'}
      macros:
        is_incremental: false
    given:
      - input: ref('rec_fair_daily')
        format: sql
        rows: |
          select 'd1' as device_id, 'rec' as community_id, d::date as local_day, 96 as n_slots, true as is_valid_day,
                 9.0::double precision as import_kwh, 0.0::double precision as export_kwh, 0.9::double precision as night_import_kwh,
                 case when d::date = date '2026-09-27' then 40 else 36 end as night_slots, 1.0::double precision as midday_import_kwh
          from generate_series(date '2026-09-21', date '2026-09-27', interval '1 day') as d
          union all
          select 'd1' as device_id, 'rec' as community_id, d::date as local_day, 96 as n_slots, (d::date < date '2026-10-02') as is_valid_day,
                 9.0::double precision as import_kwh, 0.0::double precision as export_kwh, 0.9::double precision as night_import_kwh,
                 36 as night_slots, 1.0::double precision as midday_import_kwh
          from generate_series(date '2026-09-28', date '2026-10-04', interval '1 day') as d
      - input: ref('rec_fair_community_days')
        rows: []
      - input: ref('rec_fair_device_class')
        format: sql
        rows: |
          select 'd1' as device_id, 'rec' as community_id, w::date as week_start, 'no_pv' as pv_class, 'household' as category,
                 'household/no_pv' as ref_group, false as is_quarantined, true as is_rankable
          from generate_series(date '2026-09-21', date '2026-09-28', interval '7 days') as w
    expect:
      rows:
        - {device_id: 'd1', week_start: '2026-09-21', valid_days: 7, is_valid_week: true, night_slots: 256, night_kwh_h: 0.098438, night_share: 0.1, level_metric: 0.1, level_source: 'all_days'}
        - {device_id: 'd1', week_start: '2026-09-28', valid_days: 4, is_valid_week: false, night_slots: 144, night_kwh_h: 0.1, night_share: 0.1, level_metric: null, level_source: 'no_valid_week'}

  # ─────────────────────────────────────────────────────────────────────────────
  # rec_fair_weekly_scores (fair gamification §4.3/§4.4 percentiles, Azioni, flag)
  # ─────────────────────────────────────────────────────────────────────────────

  - name: s1_s2_s3_hazen_percentiles_saturation_and_group_merge
    description: >
      household/no_pv has 6 members (stands): metrics 0.1 … 0.6 → level_pct 100,80,60,40,20,0 → points
      100,100,75,50,25,0 (saturation at the 80th). household/pv (2) + public_entity/pv (5) merge into
      all/pv with n = 7; three tied members there get 50 each... (pv rows carry tied metrics).
    model: rec_fair_weekly_scores
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('rec_fair_weekly_metrics')
        format: sql
        rows: |
          select 'h' || n as device_id, 'rec' as community_id, date '2026-09-28' as week_start, date '2026-09-01' as season_start,
                 true as is_valid_week, 7 as valid_days, 10.0::double precision as import_kwh, n * 1.0::double precision as night_import_kwh,
                 252 as night_slots, (n / 10.0)::double precision as night_share, 0.1::double precision as night_kwh_h, 3 as cloudy_valid_days,
                 null::double precision as cloudy_night_share, (n / 10.0)::double precision as level_metric, 'all_days' as level_source, 0 as level_carry_weeks,
                 null::int as growth_n, null::double precision as growth_delta, null::double precision as import_median_8w, null::double precision as night_share_prev,
                 'household/no_pv' as ref_group, 'household/no_pv' as ref_group_effective, 6 as ref_group_n, 'no_pv' as pv_class, 'household' as category, false as is_quarantined, true as is_rankable
          from generate_series(1, 6) as n
          union all
          select 'pv' || n, 'rec', date '2026-09-28', date '2026-09-01', true, 7, 10.0, 3.0, 252, 0.3, 0.1, 3, 0.3, 0.3, 'cloudy_days', 0,
                 null, null, null, null,
                 case when n <= 2 then 'household/pv' else 'public_entity/pv' end, 'all/pv', 7, 'pv', case when n <= 2 then 'household' else 'public_entity' end, false, true
          from generate_series(1, 7) as n
      - input: ref('rec_fair_device_class')
        rows: []
      - input: ref('rec_fair_commitment_outcomes')
        rows: []
    expect:
      rows:
        - {device_id: 'h1', level_pct: 100.0, level_points: 100.0, level_reason: 'saturated', ref_group_effective: 'household/no_pv', ref_group_n: 6}
        - {device_id: 'h2', level_pct: 80.0, level_points: 100.0, level_reason: 'saturated', ref_group_effective: 'household/no_pv', ref_group_n: 6}
        - {device_id: 'h3', level_pct: 60.0, level_points: 75.0, level_reason: 'all_days', ref_group_effective: 'household/no_pv', ref_group_n: 6}
        - {device_id: 'h4', level_pct: 40.0, level_points: 50.0, level_reason: 'all_days', ref_group_effective: 'household/no_pv', ref_group_n: 6}
        - {device_id: 'h5', level_pct: 20.0, level_points: 25.0, level_reason: 'all_days', ref_group_effective: 'household/no_pv', ref_group_n: 6}
        - {device_id: 'h6', level_pct: 0.0, level_points: 0.0, level_reason: 'all_days', ref_group_effective: 'household/no_pv', ref_group_n: 6}
        - {device_id: 'pv1', level_pct: 50.0, level_points: 62.5, level_reason: 'cloudy_days', ref_group_effective: 'all/pv', ref_group_n: 7}
        - {device_id: 'pv2', level_pct: 50.0, level_points: 62.5, level_reason: 'cloudy_days', ref_group_effective: 'all/pv', ref_group_n: 7}
        - {device_id: 'pv3', level_pct: 50.0, level_points: 62.5, level_reason: 'cloudy_days', ref_group_effective: 'all/pv', ref_group_n: 7}
        - {device_id: 'pv4', level_pct: 50.0, level_points: 62.5, level_reason: 'cloudy_days', ref_group_effective: 'all/pv', ref_group_n: 7}
        - {device_id: 'pv5', level_pct: 50.0, level_points: 62.5, level_reason: 'cloudy_days', ref_group_effective: 'all/pv', ref_group_n: 7}
        - {device_id: 'pv6', level_pct: 50.0, level_points: 62.5, level_reason: 'cloudy_days', ref_group_effective: 'all/pv', ref_group_n: 7}
        - {device_id: 'pv7', level_pct: 50.0, level_points: 62.5, level_reason: 'cloudy_days', ref_group_effective: 'all/pv', ref_group_n: 7}

  - name: s4_s5_s7_actions_capped_growth_median_flag_and_reasons
    description: >
      Growth: deltas −0.5, −0.3, 0.0 (median −0.3) → adj −0.2, 0, +0.2 → pct 100, 50, 0; reasons improving/stable/worsening.
      Actions: a=3 kept + 4 surplus hours = 23 → capped 20 ('capped'); b 1 kept = 5 ('kept'); c no commitments.
      Flag: a imports 14 vs 8-week median 10 (+40%) with night share 0.3 < 0.4 → flagged; b not.
      growth_n null → 'need_weeks'; growth_delta null with n → 'night_already_zero'.
    model: rec_fair_weekly_scores
    overrides:
