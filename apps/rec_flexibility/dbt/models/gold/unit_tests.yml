  # ─────────────────────────────────────────────────────────────────────────────
  # rec_fair_import_baseline / rec_fair_surplus_hours / rec_fair_commitment_outcomes
  # (fair gamification §4.4 Azioni, design 2026-10-09)
  # ─────────────────────────────────────────────────────────────────────────────

  - name: bl1_baseline_median_per_slot_weekday_over_28_days_before_week
    description: >
      For week 2026-09-28 the baseline uses days 2026-08-31 … 2026-09-27 only: weekday slot 48 median 0.2,
      weekend slot 48 median 0.4; the 9.0 reading inside the week itself is ignored.
    model: rec_fair_import_baseline
    overrides:
      vars: {fair_as_of: '2026-10-09', fair_recompute_weeks: 1, fair_history_start: '2026-09-28'}
      macros:
        is_incremental: false
    given:
      - input: ref('rec_fair_meters_15m')
        format: sql
        rows: |
          select 'd1' as device_id, 'rec' as community_id, 'S1' as substation_id,
                 (d + time '12:00') at time zone 'Europe/Rome' as ts, (d + time '12:00') as local_ts, d::date as local_day,
                 48 as slot, extract(isodow from d) <= 5 as is_weekday, false as is_night, true as is_midday,
                 case when extract(isodow from d) <= 5 then 0.2 else 0.4 end::double precision as import_kwh, 0.0::double precision as export_kwh
          from generate_series(date '2026-08-24', date '2026-09-27', interval '1 day') as d
          union all
          select 'd1', 'rec', 'S1', timestamptz '2026-09-30 12:00:00+02', timestamp '2026-09-30 12:00:00', date '2026-09-30', 48, true, false, true, 9.0, 0.0
    expect:
      rows:
        - {device_id: 'd1', week_start: '2026-09-28', slot: 48, is_weekday: true, baseline_kwh: 0.2}
        - {device_id: 'd1', week_start: '2026-09-28', slot: 48, is_weekday: false, baseline_kwh: 0.4}

  - name: su1_substation_scope_needs_six_devices_else_community_only
    description: >
      Six devices on substation A exporting → an A row (surplus); one device on B → no B row;
      the community row counts all seven and is in surplus (3.0 kWh export vs 0.25 import).
    model: rec_fair_surplus_hours
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('rec_fair_meters_15m')
        format: sql
        rows: |
          select 's' || n as device_id, 'rec' as community_id, 'A' as substation_id,
                 timestamptz '2026-10-01 12:00:00+02' + q * interval '15 minutes' as ts, date '2026-10-01' as local_day,
                 0.0::double precision as import_kwh, 0.125::double precision as export_kwh
          from generate_series(1, 6) as n cross join generate_series(0, 3) as q
          union all
          select 't0', 'rec', 'B', timestamptz '2026-10-01 12:00:00+02' + q * interval '15 minutes', date '2026-10-01', 0.0625, 0.0
          from generate_series(0, 3) as q
      - input: ref('rec_fair_device_registry')
        rows:
          - {device_id: 's1', quarantine_from: null}
          - {device_id: 's2', quarantine_from: null}
          - {device_id: 's3', quarantine_from: null}
          - {device_id: 's4', quarantine_from: null}
          - {device_id: 's5', quarantine_from: null}
          - {device_id: 's6', quarantine_from: null}
          - {device_id: 't0', quarantine_from: null}
    expect:
      rows:
        - {community_id: 'rec', scope_type: 'substation', scope_id: 'A', hour_start: '2026-10-01 12:00:00+02', export_kwh: 3.0, import_kwh: 0.0, n_devices: 6, is_surplus: true}
        - {community_id: 'rec', scope_type: 'community', scope_id: 'rec', hour_start: '2026-10-01 12:00:00+02', export_kwh: 3.0, import_kwh: 0.25, n_devices: 7, is_surplus: true}

  - name: su2_surplus_requires_export_above_import_and_skips_quarantined
    description: A quarantined device does not count; export equal to import is not surplus.
    model: rec_fair_surplus_hours
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('rec_fair_meters_15m')
        rows:
          - {device_id: 'a', community_id: 'rec', substation_id: null, ts: '2026-10-01 10:00:00+00', local_day: '2026-10-01', import_kwh: 1.0, export_kwh: 1.0}
          - {device_id: 'q', community_id: 'rec', substation_id: null, ts: '2026-10-01 10:00:00+00', local_day: '2026-10-01', import_kwh: 0.0, export_kwh: 50.0}
      - input: ref('rec_fair_device_registry')
        rows:
          - {device_id: 'a', quarantine_from: null}
          - {device_id: 'q', quarantine_from: '2026-06-01'}
    expect:
      rows:
        - {community_id: 'rec', scope_type: 'community', scope_id: 'rec', hour_start: '2026-10-01 10:00:00+00', export_kwh: 1.0, import_kwh: 1.0, n_devices: 1, is_surplus: false}

  - name: a1_overlap_matches_window_moved_by_one_hour_and_kept_at_125pct
    description: >
      Commitment 13:00–14:00 local overlaps the community window 12:00–15:00 (bounds differ) → matched.
      Import 4×0.25 = 1.0 vs baseline 4×0.2 = 0.8 → ratio 1.25 ≥ 1.10 → kept, 5 points, week of the Monday 2026-09-28.
    model: rec_fair_commitment_outcomes
    overrides:
      vars: {fair_as_of: '2026-10-09'}
      macros:
        is_incremental: false
    given:
      - input: ref('rec_commitment_settlement')
        rows:
          - {commitment_id: 'c1', device_id: 'd1', community_id: 'rec', period_start: '2026-10-01 13:00:00+02', period_end: '2026-10-01 14:00:00+02', status: 'committed', committed_at: '2026-09-30 18:00:00+02'}
      - input: ref('rec_flexibility_windows_community')
        rows:
          - {community_id: 'rec', ts_date: '2026-10-01', window_start: '2026-10-01 12:00:00', window_end: '2026-10-01 15:00:00'}
      - input: ref('rec_fair_meters_15m')
        format: sql
        rows: |
          select 'd1' as device_id, 'rec' as community_id, 'A' as substation_id,
                 timestamptz '2026-10-01 13:00:00+02' + q * interval '15 minutes' as ts, 52 + q as slot, true as is_weekday,
                 0.25::double precision as import_kwh, 0.0::double precision as export_kwh
          from generate_series(0, 3) as q
      - input: ref('rec_fair_import_baseline')
        rows:
          - {device_id: 'd1', week_start: '2026-09-28', slot: 52, is_weekday: true, baseline_kwh: 0.2}
          - {device_id: 'd1', week_start: '2026-09-28', slot: 53, is_weekday: true, baseline_kwh: 0.2}
          - {device_id: 'd1', week_start: '2026-09-28', slot: 54, is_weekday: true, baseline_kwh: 0.2}
          - {device_id: 'd1', week_start: '2026-09-28', slot: 55, is_weekday: true, baseline_kwh: 0.2}
      - input: ref('rec_fair_surplus_hours')
        rows: []
      - input: ref('rec_fair_device_registry')
        rows:
          - {device_id: 'd1', substation_id: 'A'}
    expect:
      rows:
        - {commitment_id: 'c1', device_id: 'd1', week_start: '2026-09-28', matched: true, window_start: '2026-10-01 12:00:00+02', actual_import_kwh: 1.0, baseline_import_kwh: 0.8, is_kept: true, points: 5, surplus_hours_kept: 0, surplus_points: 0, reason: 'kept'}

  - name: a2_kept_threshold_is_110pct_inclusive
    description: 4×0.2 = 0.8 vs baseline 0.8 → not kept; 4×0.275 = 1.1 vs baseline 1.0 → exactly 110% → kept.
    model: rec_fair_commitment_outcomes
    overrides:
      vars: {fair_as_of: '2026-10-09'}
      macros:
        is_incremental: false
    given:
      - input: ref('rec_commitment_settlement')
        rows:
          - {commitment_id: 'low', device_id: 'd1', community_id: 'rec', period_start: '2026-10-01 13:00:00+02', period_end: '2026-10-01 14:00:00+02', status: 'settled', committed_at: '2026-09-30 18:00:00+02'}
          - {commitment_id: 'edge', device_id: 'd2', community_id: 'rec', period_start: '2026-10-01 13:00:00+02', period_end: '2026-10-01 14:00:00+02', status: 'committed', committed_at: '2026-09-30 18:00:00+02'}
      - input: ref('rec_flexibility_windows_community')
        rows:
