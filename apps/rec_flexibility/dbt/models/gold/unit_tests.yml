          - {commitment_id: 'rej', device_id: 'd1', community_id: 'rec', period_start: '2026-10-01 12:00:00+02', period_end: '2026-10-01 13:00:00+02', status: 'rejected', committed_at: '2026-09-30 18:00:00+02'}
