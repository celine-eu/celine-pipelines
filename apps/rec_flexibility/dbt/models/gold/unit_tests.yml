      - input: ref('rec_device_class')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01', is_m1_only: false}
      - input: ref('rec_device_baselines')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01', baseline_type: 'settlement', slot: 36, is_weekday: false, baseline_kwh: 0.1}
          - {community_id: 'example-rec', device_id: 'dev-01', baseline_type: 'settlement', slot: 37, is_weekday: false, baseline_kwh: 0.1}
          - {community_id: 'example-rec', device_id: 'dev-01', baseline_type: 'settlement', slot: 38, is_weekday: false, baseline_kwh: 0.1}
          - {community_id: 'example-rec', device_id: 'dev-01', baseline_type: 'settlement', slot: 39, is_weekday: false, baseline_kwh: 0.1}
          - {community_id: 'example-rec', device_id: 'dev-01', baseline_type: 'settlement', slot: 40, is_weekday: false, baseline_kwh: 0.1}
          - {community_id: 'example-rec', device_id: 'dev-01', baseline_type: 'settlement', slot: 41, is_weekday: false, baseline_kwh: 0.1}
          - {community_id: 'example-rec', device_id: 'dev-01', baseline_type: 'settlement', slot: 42, is_weekday: false, baseline_kwh: 0.1}
          - {community_id: 'example-rec', device_id: 'dev-01', baseline_type: 'settlement', slot: 43, is_weekday: false, baseline_kwh: 0.1}
          - {community_id: 'example-rec', device_id: 'dev-01', baseline_type: 'shift_potential', slot: 36, is_weekday: false, baseline_kwh: 0.05}
          - {community_id: 'example-rec', device_id: 'dev-01', baseline_type: 'shift_potential', slot: 37, is_weekday: false, baseline_kwh: 0.05}
          - {community_id: 'example-rec', device_id: 'dev-01', baseline_type: 'shift_potential', slot: 38, is_weekday: false, baseline_kwh: 0.05}
          - {community_id: 'example-rec', device_id: 'dev-01', baseline_type: 'shift_potential', slot: 39, is_weekday: false, baseline_kwh: 0.05}
          - {community_id: 'example-rec', device_id: 'dev-01', baseline_type: 'shift_potential', slot: 40, is_weekday: false, baseline_kwh: 0.05}
          - {community_id: 'example-rec', device_id: 'dev-01', baseline_type: 'shift_potential', slot: 41, is_weekday: false, baseline_kwh: 0.05}
          - {community_id: 'example-rec', device_id: 'dev-01', baseline_type: 'shift_potential', slot: 42, is_weekday: false, baseline_kwh: 0.05}
          - {community_id: 'example-rec', device_id: 'dev-01', baseline_type: 'shift_potential', slot: 43, is_weekday: false, baseline_kwh: 0.05}
      - input: source('meters_gold', 'meters_energy_forecast')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01', timestamp: '2024-06-01 09:00:00', total_consumption_kwh: 0.0, grid_import_kwh: null, period: 'forecast', data_missing: 0}
          - {community_id: 'example-rec', device_id: 'dev-01', timestamp: '2024-06-01 10:00:00', total_consumption_kwh: 0.0, grid_import_kwh: null, period: 'forecast', data_missing: 0}
    expect:
      rows:
        - {device_id: 'dev-01', estimated_kwh: "1.20", reward_points_estimated: 11, confidence: 0.62}

