          - {community_id: 'rec', scope_type: 'substation', scope_id: 'A', hour_start: '2026-10-01 14:00:00+02', is_surplus: false}
          - {community_id: 'rec', scope_type: 'community', scope_id: 'rec', hour_start: '2026-10-01 14:00:00+02', is_surplus: true}
