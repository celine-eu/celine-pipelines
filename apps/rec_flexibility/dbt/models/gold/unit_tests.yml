      - input: ref('rec_fair_weekly_metrics')
        rows: []
    expect:
      rows:
        - {device_id: 'a', season_start: '2026-09-01', season_end: '2026-11-01', elapsed_weeks: 6, required_weeks: 3, valid_weeks: 2, is_ranked: false, rank_reason: 'min_weeks', general_rank: null, virtuosi_rank: null, is_current_season: true}

  - name: b2_virtuosi_tiebreak_actions_then_weeks_at_100
    description: >
      Three households with the same mean Level (93.33): a and c have 10 Actions, b has 0 → b is 3rd;
      a and c tie on Actions and weeks at 100 → both rank 1. total_ranked_virtuosi = 3.
    model: rec_fair_season_boards
    overrides:
      vars: {fair_as_of: '2026-09-28'}
      macros:
        is_incremental: false
    given:
      - input: ref('rec_fair_weekly_scores')
        format: sql
        rows: |
          select d as device_id, 'rec' as community_id, w::date as week_start, date '2026-09-01' as season_start, true as is_valid_week,
                 (array[100.0, 80.0, 100.0])[((w::date - date '2026-09-07') / 7) + 1]::double precision as level_points,
                 50.0::double precision as growth_points, null::text as growth_reason,
                 case when d = 'b' then 0 else (array[5, 5, 0])[((w::date - date '2026-09-07') / 7) + 1] end as actions_points,
                 100.0::double precision as weekly_points
          from unnest(array['a', 'b', 'c']) as d cross join generate_series(date '2026-09-07', date '2026-09-21', interval '7 days') as w
      - input: ref('rec_fair_device_class')
        rows:
          - {device_id: 'a', community_id: 'rec', week_start: '2026-09-21', category: 'household', pv_class: 'no_pv', ref_group: 'household/no_pv', is_in_app: true, is_quarantined: false, is_silent: false}
          - {device_id: 'b', community_id: 'rec', week_start: '2026-09-21', category: 'household', pv_class: 'no_pv', ref_group: 'household/no_pv', is_in_app: true, is_quarantined: false, is_silent: false}
          - {device_id: 'c', community_id: 'rec', week_start: '2026-09-21', category: 'household', pv_class: 'no_pv', ref_group: 'household/no_pv', is_in_app: true, is_quarantined: false, is_silent: false}
      - input: ref('rec_fair_weekly_metrics')
        rows: []
    expect:
      rows:
        - {device_id: 'a', elapsed_weeks: 3, required_weeks: 2, is_ranked: true, mean_level: 93.333333, actions_sum: 10, weeks_at_100: 2, virtuosi_rank: 1, total_ranked_virtuosi: 3}
        - {device_id: 'b', elapsed_weeks: 3, required_weeks: 2, is_ranked: true, mean_level: 93.333333, actions_sum: 0, weeks_at_100: 2, virtuosi_rank: 3, total_ranked_virtuosi: 3}
        - {device_id: 'c', elapsed_weeks: 3, required_weeks: 2, is_ranked: true, mean_level: 93.333333, actions_sum: 10, weeks_at_100: 2, virtuosi_rank: 1, total_ranked_virtuosi: 3}

  - name: b3_general_uses_only_weeks_with_both_and_adds_actions
    description: >
      a: week 1 has no Growth (not counted), week 2 L60/G40 → general 50 + mean weekly Actions
      (Σ 10 / 2 elapsed weeks = 5) = 55; mean_level 80 (spec §4.5, 2026-11-05: Actions as a weekly mean).
      b: both weeks L20/G20 → 20. a ranks 1st in Generale; b's growth_score is 20, a's 40.
