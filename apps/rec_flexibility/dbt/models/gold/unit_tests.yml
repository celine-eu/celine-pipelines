        - {device_id: 'h1', ref_group_effective: 'all/no_pv', ref_group_n: 7}
        - {device_id: 'h2', ref_group_effective: 'all/no_pv', ref_group_n: 7}
        - {device_id: 'h3', ref_group_effective: 'all/no_pv', ref_group_n: 7}
        - {device_id: 'h4', ref_group_effective: 'all/no_pv', ref_group_n: 7}
        - {device_id: 'h5', ref_group_effective: 'all/no_pv', ref_group_n: 7}
        - {device_id: 'p1', ref_group_effective: 'all/no_pv', ref_group_n: 7}
        - {device_id: 'p2', ref_group_effective: 'all/no_pv', ref_group_n: 7}
        - {device_id: 'b1', ref_group_effective: 'business/no_pv', ref_group_n: 0}
        - {device_id: 'b2', ref_group_effective: 'business/no_pv', ref_group_n: 0}
