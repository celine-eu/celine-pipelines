  - name: cw6_confidence_is_realized_hit_rate_of_past_windows
    description: >
      Confidence = share of past predicted window hours (30-day lookback) where the
      actual community net export exceeded the surplus threshold. One past 2-hour
      window with 1 hit (1.0 kWh) and 1 miss (0.2 kWh) -> 0.50, stamped on the new
      forecast window.
    model: rec_flexibility_windows_community
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        format: sql
        rows: |
          select
            'past-1'::text                                            as _id,
            'example-rec'::text                                       as community_id,
            (current_date - 1)::date                                  as ts_date,
            (current_date - 1)::timestamp + interval '9 hours'        as window_start,
            (current_date - 1)::timestamp + interval '11 hours'       as window_end,
            2.0::numeric                                              as community_kwh,
            null::numeric                                             as confidence,
            'solar_overproduction'::text                              as flexibility_model
      - input: source('meters_gold', 'total_meters_forecast')
        format: sql
        rows: |
          select ((current_date - 1)::timestamp + interval '9 hours')::text  as timestamp, 'actual'::text   as period, 1.0::float as net_exchange_kwh, null::text as generated_at, 'example-rec'::text as community_id
          union all
          select ((current_date - 1)::timestamp + interval '10 hours')::text as timestamp, 'actual'::text   as period, 0.2::float as net_exchange_kwh, null::text as generated_at, 'example-rec'::text as community_id
          union all
          select (current_date::timestamp + interval '9 hours')::text        as timestamp, 'forecast'::text as period, 1.0::float as net_exchange_kwh, '2099-01-01'::text as generated_at, 'example-rec'::text as community_id
          union all
          select (current_date::timestamp + interval '10 hours')::text       as timestamp, 'forecast'::text as period, 1.0::float as net_exchange_kwh, '2099-01-01'::text as generated_at, 'example-rec'::text as community_id
          union all
          select (current_date::timestamp + interval '11 hours')::text       as timestamp, 'forecast'::text as period, 1.0::float as net_exchange_kwh, '2099-01-01'::text as generated_at, 'example-rec'::text as community_id
    expect:
      format: sql
      rows: |
        select
          md5(
            current_date::date::text
            || (current_date::timestamp + interval '9 hours')::text
            || (current_date::timestamp + interval '12 hours')::text
          )                                                      as _id,
          'example-rec'::text                                    as community_id,
          current_date::date                                    as ts_date,
          current_date::timestamp + interval '9 hours'          as window_start,
          current_date::timestamp + interval '12 hours'         as window_end,
          '3.00'::numeric                                       as community_kwh,
          '0.50'::numeric                                       as confidence,
          'solar_overproduction'::text                          as flexibility_model

  - name: cw7_confidence_null_when_no_scored_history
    description: >
      When no already-materialized window falls inside the 30-day scoring lookback
      (only a window from 40 days ago exists), past_window_hours is empty and
      raw_rate is null. The explicit NULL guard must propagate that NULL rather than
      letting greatest(0.30, null) silently coerce it to the 0.30 floor.
    model: rec_flexibility_windows_community
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        format: sql
        rows: |
          select
            'past-old'::text                                            as _id,
            'example-rec'::text                                       as community_id,
            (current_date - 40)::date                                  as ts_date,
            (current_date - 40)::timestamp + interval '9 hours'        as window_start,
            (current_date - 40)::timestamp + interval '11 hours'       as window_end,
            2.0::numeric                                                as community_kwh,
            null::numeric                                               as confidence,
            'solar_overproduction'::text                                as flexibility_model
      - input: source('meters_gold', 'total_meters_forecast')
        format: sql
        rows: |
          select (current_date::timestamp + interval '9 hours')::text        as timestamp, 'forecast'::text as period, 1.0::float as net_exchange_kwh, '2099-01-01'::text as generated_at, 'example-rec'::text as community_id
          union all
          select (current_date::timestamp + interval '10 hours')::text       as timestamp, 'forecast'::text as period, 1.0::float as net_exchange_kwh, '2099-01-01'::text as generated_at, 'example-rec'::text as community_id
    expect:
      format: sql
      rows: |
        select
          md5(
            current_date::date::text
            || (current_date::timestamp + interval '9 hours')::text
            || (current_date::timestamp + interval '11 hours')::text
          )                                                      as _id,
          'example-rec'::text                                    as community_id,
          current_date::date                                    as ts_date,
          current_date::timestamp + interval '9 hours'          as window_start,
          current_date::timestamp + interval '11 hours'         as window_end,
          '2.00'::numeric                                       as community_kwh,
          null::numeric                                         as confidence,
          'solar_overproduction'::text                          as flexibility_model

  # ─────────────────────────────────────────────────────────────────────────────
  # rec_commitment_settlement
  # ─────────────────────────────────────────────────────────────────────────────

  - name: c1_single_device_under_budget_gets_full_actual_kwh
    description: >
      One committed device whose actual_kwh is below community_kwh gets allocated = actual.
      adherence_ratio = reward_points_actual / reward_points_estimated = 1.0 when settled.
    model: rec_commitment_settlement
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('silver_flexibility_commitments')
        rows:
          - {commitment_id: 'c-01', device_id: 'dev-01', suggestion_id: 's-01',
             suggestion_type: 'solar_overproduction', community_id: 'com-01',
             period_start: '2024-06-01 09:00:00', period_end: '2024-06-01 12:00:00',
             status: 'settled', reward_points_estimated: 30,
             committed_at: '2024-06-01 08:00:00', last_updated: '2024-06-01 13:00:00'}
      - input: ref('rec_settlement_1h')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01', ts: '2024-06-01 09:00:00', consumption_kwh: 1.0, window_start: '2024-06-01 09:00:00'}
          - {community_id: 'example-rec', device_id: 'dev-01', ts: '2024-06-01 10:00:00', consumption_kwh: 1.0, window_start: '2024-06-01 09:00:00'}
          - {community_id: 'example-rec', device_id: 'dev-01', ts: '2024-06-01 11:00:00', consumption_kwh: 1.0, window_start: '2024-06-01 09:00:00'}
      - input: ref('rec_flexibility_windows')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01', window_start: '2024-06-01 09:00:00', window_end: '2024-06-01 12:00:00', community_kwh: 5.0}
      - input: ref('rec_settlement_points')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01', ts: '2024-06-01 09:00:00', settlement_points: 10.0}
          - {community_id: 'example-rec', device_id: 'dev-01', ts: '2024-06-01 10:00:00', settlement_points: 10.0}
          - {community_id: 'example-rec', device_id: 'dev-01', ts: '2024-06-01 11:00:00', settlement_points: 10.0}
      - input: ref('rec_flexibility_bonus')
        rows: []
    expect:
      rows:
        - {commitment_id: 'c-01', reward_points_actual: 30}

  - name: c2_multiple_devices_over_budget_get_proportional_share
    description: >
      Three devices share the same suggestion. Their combined actual_kwh (7.0) exceeds
      community_kwh (4.0). Each device receives actual/total × budget.
      dev-01 (1.0): 1/7×4=0.5714... wait — using clean numbers: dev-01=1.0, dev-02=3.0 → total=4.0, budget=2.0.
      dev-01: 1.0/4.0×2.0=0.5, dev-02: 3.0/4.0×2.0=1.5. Points: 5 and 15.
    model: rec_commitment_settlement
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('silver_flexibility_commitments')
        rows:
          - {commitment_id: 'c-01', device_id: 'dev-01', suggestion_id: 's-01',
             suggestion_type: 'solar_overproduction', community_id: 'com-01',
             period_start: '2024-06-01 09:00:00', period_end: '2024-06-01 12:00:00',
             status: 'committed', reward_points_estimated: 10,
             committed_at: '2024-06-01 08:00:00', last_updated: '2024-06-01 09:00:00'}
          - {commitment_id: 'c-02', device_id: 'dev-02', suggestion_id: 's-01',
             suggestion_type: 'solar_overproduction', community_id: 'com-01',
             period_start: '2024-06-01 09:00:00', period_end: '2024-06-01 12:00:00',
             status: 'committed', reward_points_estimated: 30,
             committed_at: '2024-06-01 08:00:00', last_updated: '2024-06-01 09:00:00'}
      - input: ref('rec_settlement_1h')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01', ts: '2024-06-01 09:00:00', consumption_kwh: 1.0, window_start: '2024-06-01 09:00:00'}
          - {community_id: 'example-rec', device_id: 'dev-02', ts: '2024-06-01 09:00:00', consumption_kwh: 3.0, window_start: '2024-06-01 09:00:00'}
      - input: ref('rec_flexibility_windows')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01', window_start: '2024-06-01 09:00:00', window_end: '2024-06-01 12:00:00', community_kwh: 2.0}
          - {community_id: 'example-rec', device_id: 'dev-02', window_start: '2024-06-01 09:00:00', window_end: '2024-06-01 12:00:00', community_kwh: 2.0}
      - input: ref('rec_settlement_points')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01', ts: '2024-06-01 09:00:00', settlement_points: 5.0}
          - {community_id: 'example-rec', device_id: 'dev-02', ts: '2024-06-01 09:00:00', settlement_points: 15.0}
      - input: ref('rec_flexibility_bonus')
        rows: []
    expect:
      rows:
        - {commitment_id: 'c-01', actual_kwh: 1.0, allocated_kwh: 0.5, reward_points_actual: 5}
        - {commitment_id: 'c-02', actual_kwh: 3.0, allocated_kwh: 1.5, reward_points_actual: 15}

