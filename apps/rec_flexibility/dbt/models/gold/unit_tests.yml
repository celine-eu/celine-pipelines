          - {device_id: 'b', community_id: 'rec', week_start: '2026-09-14', category: 'household', pv_class: 'no_pv', ref_group: 'household/no_pv', is_in_app: true, is_quarantined: false, is_silent: false}
      - input: ref('rec_fair_weekly_metrics')
        rows: []
    expect:
      rows:
        - {device_id: 'a', weeks_with_level: 2, weeks_with_growth: 1, weeks_with_both: 1, mean_level: 80.0, general_score: 55.0, general_rank: 1, growth_score: 40.0, growth_rank: 1, season_points: 210.0}
        - {device_id: 'b', weeks_with_level: 2, weeks_with_growth: 2, weeks_with_both: 2, mean_level: 20.0, general_score: 20.0, general_rank: 2, growth_score: 20.0, growth_rank: 2, season_points: 80.0}

