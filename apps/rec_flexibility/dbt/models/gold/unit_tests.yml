  - name: a6_current_week_commitment_has_no_outcome_yet
    description: >
      Outcomes land once a week: a commitment whose week is not complete at fair_as_of produces no row
      (the flexibility-api keeps it committed and retries), even when meter rows and a window exist.
    model: rec_fair_commitment_outcomes
    overrides:
      vars: {fair_as_of: '2026-10-02'}
      macros:
        is_incremental: false
    given:
      - input: ref('rec_commitment_settlement')
        rows:
          - {commitment_id: 'c1', device_id: 'd1', community_id: 'rec', period_start: '2026-10-01 13:00:00+02', period_end: '2026-10-01 14:00:00+02', status: 'committed', committed_at: '2026-09-30 18:00:00+02'}
      - input: ref('rec_flexibility_windows_community')
        rows:
          - {community_id: 'rec', ts_date: '2026-10-01', window_start: '2026-10-01 12:00:00', window_end: '2026-10-01 15:00:00'}
      - input: ref('rec_fair_meters_15m')
        format: sql
        rows: |
          select 'd1' as device_id, 'rec' as community_id, 'A' as substation_id,
                 timestamptz '2026-10-01 13:00:00+02' + q * interval '15 minutes' as ts, 52 + q as slot, true as is_weekday,
                 0.5::double precision as import_kwh, 0.0::double precision as export_kwh from generate_series(0, 3) as q
      - input: ref('rec_fair_import_baseline')
        rows: []
      - input: ref('rec_fair_surplus_hours')
        rows: []
      - input: ref('rec_fair_device_registry')
        rows:
          - {device_id: 'd1', substation_id: 'A'}
    expect:
      rows: []

  - name: a7_commitment_without_a_baseline_is_no_data_not_kept
    description: >
      Meter rows exist but the device has no baseline for that week (no history in the 28 days before):
      the commitment is 'no_data', never judged against the 0.05 kWh floor.
    model: rec_fair_commitment_outcomes
    overrides:
      vars: {fair_as_of: '2026-10-09'}
      macros:
        is_incremental: false
    given:
      - input: ref('rec_commitment_settlement')
        rows:
          - {commitment_id: 'c1', device_id: 'd1', community_id: 'rec', period_start: '2026-10-01 13:00:00+02', period_end: '2026-10-01 14:00:00+02', status: 'committed', committed_at: '2026-09-30 18:00:00+02'}
      - input: ref('rec_flexibility_windows_community')
        rows:
          - {community_id: 'rec', ts_date: '2026-10-01', window_start: '2026-10-01 12:00:00', window_end: '2026-10-01 15:00:00'}
      - input: ref('rec_fair_meters_15m')
        format: sql
        rows: |
          select 'd1' as device_id, 'rec' as community_id, 'A' as substation_id,
