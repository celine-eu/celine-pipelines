  - name: m8_businesses_and_unknown_are_not_peers
    description: >
      5 households and 2 public entities without PV, plus 9 businesses and 1 unknown device without PV.
      household/no_pv (5 < 6) merges with public_entity/no_pv only: all/no_pv, n = 7. Businesses and the
      unknown device are nobody's peers: they keep their own ref_group and ref_group_n = 0.
    model: rec_fair_weekly_metrics
    overrides:
      vars: {fair_as_of: '2026-10-09', fair_recompute_weeks: 1, fair_history_start: '2026-09-28'}
      macros:
        is_incremental: false
    given:
      - input: ref('rec_fair_daily')
        format: sql
        rows: |
          select d as device_id, 'rec' as community_id, day::date as local_day, 96 as n_slots, true as is_valid_day,
                 10.0::double precision as import_kwh, 0.0::double precision as export_kwh, 3.0::double precision as night_import_kwh,
                 36 as night_slots, 1.0::double precision as midday_import_kwh
          from unnest(array['h1','h2','h3','h4','h5','p1','p2','b1','b2','b3','b4','b5','b6','b7','b8','b9','u1']) as d
          cross join generate_series(date '2026-09-28', date '2026-10-04', interval '1 day') as day
      - input: ref('rec_fair_community_days')
        rows: []
      - input: ref('rec_fair_device_class')
        format: sql
        rows: |
          select d as device_id, 'rec' as community_id, date '2026-09-28' as week_start, 'no_pv' as pv_class,
                 c as category, c || '/no_pv' as ref_group, false as is_quarantined, c in ('household', 'public_entity') as is_rankable
          from (select d, case left(d, 1) when 'h' then 'household' when 'p' then 'public_entity' when 'b' then 'business' else 'unknown' end as c
                from unnest(array['h1','h2','h3','h4','h5','p1','p2','b1','b2','b3','b4','b5','b6','b7','b8','b9','u1']) as d) x
    expect:
