  - name: s8_businesses_are_not_in_percentiles_or_the_growth_median
    description: >
      Two households and one business share ref_group_effective all/no_pv (as an older row could).
      The business is not a peer: h1 (0.3) beats h2 (0.5) → 100 / 0; the Growth median is that of h1, h2
      only (−0.2 and 0.0 → −0.1); the business gets no percentiles, reasons 'not_compared'.
    model: rec_fair_weekly_scores
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('rec_fair_weekly_metrics')
        rows:
          - {device_id: 'h1', community_id: 'rec', week_start: '2026-09-28', season_start: '2026-09-01', is_valid_week: true, valid_days: 7, import_kwh: 10.0, night_import_kwh: 3.0, night_slots: 252, night_share: 0.3, night_kwh_h: 0.1, cloudy_valid_days: 3, cloudy_night_share: null, level_metric: 0.3, level_source: 'all_days', level_carry_weeks: 0, growth_n: 2, growth_delta: -0.2, import_median_8w: 10.0, night_share_prev: 0.3, ref_group: 'household/no_pv', ref_group_effective: 'all/no_pv', ref_group_n: 2, pv_class: 'no_pv', category: 'household', is_quarantined: false}
          - {device_id: 'h2', community_id: 'rec', week_start: '2026-09-28', season_start: '2026-09-01', is_valid_week: true, valid_days: 7, import_kwh: 10.0, night_import_kwh: 5.0, night_slots: 252, night_share: 0.5, night_kwh_h: 0.1, cloudy_valid_days: 3, cloudy_night_share: null, level_metric: 0.5, level_source: 'all_days', level_carry_weeks: 0, growth_n: 2, growth_delta: 0.0, import_median_8w: 10.0, night_share_prev: 0.5, ref_group: 'household/no_pv', ref_group_effective: 'all/no_pv', ref_group_n: 2, pv_class: 'no_pv', category: 'household', is_quarantined: false}
          - {device_id: 'b1', community_id: 'rec', week_start: '2026-09-28', season_start: '2026-09-01', is_valid_week: true, valid_days: 7, import_kwh: 10.0, night_import_kwh: 1.0, night_slots: 252, night_share: 0.1, night_kwh_h: 0.1, cloudy_valid_days: 3, cloudy_night_share: null, level_metric: 0.1, level_source: 'all_days', level_carry_weeks: 0, growth_n: 2, growth_delta: -0.9, import_median_8w: 10.0, night_share_prev: 0.1, ref_group: 'business/no_pv', ref_group_effective: 'all/no_pv', ref_group_n: 0, pv_class: 'no_pv', category: 'business', is_quarantined: false}
      - input: ref('rec_fair_device_class')
        rows: []
      - input: ref('rec_fair_commitment_outcomes')
        rows: []
    expect:
      rows:
        - {device_id: 'h1', level_pct: 100.0, level_points: 100.0, growth_group_median: -0.1, growth_pct: 100.0, level_reason: 'saturated', growth_reason: 'improving'}
        - {device_id: 'h2', level_pct: 0.0, level_points: 0.0, growth_group_median: -0.1, growth_pct: 0.0, level_reason: 'all_days', growth_reason: 'worsening'}
        - {device_id: 'b1', level_pct: null, level_points: null, growth_group_median: -0.1, growth_pct: null, level_reason: 'not_compared', growth_reason: 'not_compared'}

  - name: b6_general_is_level_alone_when_night_is_already_zero
    description: >
      z: Growth undefined because the night import is already near zero, L 100 both weeks → Generale input
      L alone → weeks_with_both 2, general_score 100, ranked 1st. n: Growth undefined for lack of weeks
      (need_weeks) → no Generale input, general_score null, but still in Virtuosi.
      m: L 60 / G 40 both weeks → 50.
    model: rec_fair_season_boards
    overrides:
      vars: {fair_as_of: '2026-09-21'}
      macros:
        is_incremental: false
    given:
      - input: ref('rec_fair_weekly_scores')
        format: sql
        rows: |
          select d as device_id, 'rec' as community_id, w::date as week_start, date '2026-09-01' as season_start, true as is_valid_week,
                 (case d when 'z' then 100.0 when 'n' then 80.0 else 60.0 end)::double precision as level_points,
                 (case d when 'm' then 40.0 end)::double precision as growth_points,
                 case d when 'z' then 'night_already_zero' when 'n' then 'need_weeks' else 'stable' end as growth_reason,
                 0 as actions_points, 100.0::double precision as weekly_points
          from unnest(array['z', 'n', 'm']) as d cross join generate_series(date '2026-09-07', date '2026-09-14', interval '7 days') as w
      - input: ref('rec_fair_device_class')
        rows:
          - {device_id: 'z', community_id: 'rec', week_start: '2026-09-14', category: 'household', pv_class: 'pv', ref_group: 'household/pv', is_in_app: true, is_quarantined: false, is_silent: false}
          - {device_id: 'n', community_id: 'rec', week_start: '2026-09-14', category: 'household', pv_class: 'pv', ref_group: 'household/pv', is_in_app: true, is_quarantined: false, is_silent: false}
          - {device_id: 'm', community_id: 'rec', week_start: '2026-09-14', category: 'household', pv_class: 'pv', ref_group: 'household/pv', is_in_app: true, is_quarantined: false, is_silent: false}
      - input: ref('rec_fair_weekly_metrics')
        rows: []
    expect:
      rows:
        - {device_id: 'z', weeks_with_both: 2, mean_general: 100.0, general_score: 100.0, general_rank: 1, virtuosi_rank: 1, total_ranked_general: 2}
        - {device_id: 'n', weeks_with_both: 0, mean_general: null, general_score: null, general_rank: null, virtuosi_rank: 2, total_ranked_general: 2}
        - {device_id: 'm', weeks_with_both: 2, mean_general: 50.0, general_score: 50.0, general_rank: 2, virtuosi_rank: 3, total_ranked_general: 2}
