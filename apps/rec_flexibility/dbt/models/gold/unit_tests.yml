    description: 4 public entities and 6 households, all no_pv → everyone is compared in 'all/no_pv' (n = 10); the 7 households with PV stand alone.
    model: rec_fair_weekly_metrics
    overrides:
      vars: {fair_as_of: '2026-10-09', fair_recompute_weeks: 1, fair_history_start: '2026-09-28'}
