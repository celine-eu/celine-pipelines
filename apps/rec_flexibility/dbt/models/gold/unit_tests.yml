  # ─────────────────────────────────────────────────────────────────────────────
  # rec_fair_daily / rec_fair_community_days (fair gamification §4.4/§4.6)
  # ─────────────────────────────────────────────────────────────────────────────

  - name: q1_duplicate_rows_take_max_not_sum
    description: Two silver rows for the same device/quarter collapse to one slot with max(), never a sum.
    model: rec_fair_daily
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('rec_fair_meters_15m')
        rows:
          - {device_id: 'd1', community_id: 'rec', substation_id: 'S1', ts: '2026-07-01 10:00:00+00', local_day: '2026-07-01', slot: 48, is_weekday: true, is_night: false, is_midday: true, import_kwh: 0.3, export_kwh: 0.0}
    expect:
      rows:
        - {device_id: 'd1', local_day: '2026-07-01', n_slots: 1, import_kwh: 0.3, midday_import_kwh: 0.3, night_slots: 0, is_valid_day: false}

  - name: q2_night_window_21_06_rome
    description: >
      21:15 local (19:15 UTC in July) is night; 06:00 local (04:00 UTC) is not; the view computes
      is_night from the Europe/Rome clock and the daily model sums night import accordingly.
    model: rec_fair_meters_15m
    given:
      - input: source('metering_silver', 'meters_data')
        rows:
          - {device_id: 'd1', cf_type: 'CF2', ts: '2026-07-01 19:15:00+00', meter_type: 'M1', consumption_kwh: 0.2, production_kwh: 0.0}
          - {device_id: 'd1', cf_type: 'CF2', ts: '2026-07-01 04:00:00+00', meter_type: 'M1', consumption_kwh: 0.2, production_kwh: 0.0}
          - {device_id: 'd1', cf_type: 'CF2', ts: '2026-07-01 03:45:00+00', meter_type: 'M1', consumption_kwh: 0.2, production_kwh: 0.0}
          - {device_id: 'd1', cf_type: 'CF2', ts: '2026-07-01 10:00:00+00', meter_type: 'M1', consumption_kwh: 0.1, production_kwh: 0.0}
          - {device_id: 'd1', cf_type: 'CF2', ts: '2026-07-01 10:00:00+00', meter_type: 'M1', consumption_kwh: 0.3, production_kwh: 0.0}
          - {device_id: 'd1', cf_type: 'CF101', ts: '2026-07-01 10:00:00+00', meter_type: 'M2', consumption_kwh: 0.0, production_kwh: 0.9}
      - input: ref('rec_fair_device_registry')
        rows:
          - {device_id: 'd1', community_id: 'rec', substation_id: 'S1'}
    expect:
      rows:
        - {device_id: 'd1', ts: '2026-07-01 19:15:00+00', local_day: '2026-07-01', slot: 85, is_night: true, is_midday: false, import_kwh: 0.2}
        - {device_id: 'd1', ts: '2026-07-01 04:00:00+00', local_day: '2026-07-01', slot: 24, is_night: false, is_midday: false, import_kwh: 0.2}
        - {device_id: 'd1', ts: '2026-07-01 03:45:00+00', local_day: '2026-07-01', slot: 23, is_night: true, is_midday: false, import_kwh: 0.2}
        - {device_id: 'd1', ts: '2026-07-01 10:00:00+00', local_day: '2026-07-01', slot: 48, is_night: false, is_midday: true, import_kwh: 0.3}

  - name: q3_valid_day_threshold_87_and_night_slots
    description: 87 quarters make a valid day (86 would not); night quarters are counted and summed.
    model: rec_fair_daily
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('rec_fair_meters_15m')
        format: sql
        rows: |
          select 'd1' as device_id, 'rec' as community_id, 'S1' as substation_id,
                 ts, (ts at time zone 'Europe/Rome')::date as local_day, 0 as slot, true as is_weekday,
                 (n < 36) as is_night, false as is_midday, 0.25::double precision as import_kwh, 0.0::double precision as export_kwh
          from (select generate_series(1, 87) as n, timestamptz '2026-07-01 00:00:00+02' + (generate_series(1, 87) - 1) * interval '15 minutes' as ts) s
          union all
          select 'd2', 'rec', 'S1', ts, (ts at time zone 'Europe/Rome')::date, 0, true, false, false, 0.1, 0.0
          from (select timestamptz '2026-07-01 00:00:00+02' + (generate_series(1, 86) - 1) * interval '15 minutes' as ts) s
    expect:
      rows:
        - {device_id: 'd1', local_day: '2026-07-01', n_slots: 87, is_valid_day: true, night_slots: 35, night_import_kwh: 8.75}
        - {device_id: 'd2', local_day: '2026-07-01', n_slots: 86, is_valid_day: false, night_slots: 0, night_import_kwh: 0.0}

  - name: q4_dst_fallback_day_has_100_slots_and_40_night_slots
    description: On 2026-10-25 the local day has 100 quarters (02:00–03:00 twice); night 21–06 holds 40 of them; the day is valid.
    model: rec_fair_daily
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('rec_fair_meters_15m')
        format: sql
        rows: |
          select 'd1' as device_id, 'rec' as community_id, 'S1' as substation_id, ts,
                 (ts at time zone 'Europe/Rome')::date as local_day, 0 as slot, false as is_weekday,
                 ((ts at time zone 'Europe/Rome')::time >= '21:00' or (ts at time zone 'Europe/Rome')::time < '06:00') as is_night,
                 false as is_midday, 0.1::double precision as import_kwh, 0.0::double precision as export_kwh
          from generate_series(timestamptz '2026-10-25 00:00:00+02', timestamptz '2026-10-26 00:00:00+01' - interval '15 minutes', interval '15 minutes') as ts
    expect:
      rows:
        - {device_id: 'd1', local_day: '2026-10-25', n_slots: 100, night_slots: 40, is_valid_day: true}

  - name: c1_cloudy_threshold_trailing_28_days_is_causal
    description: >
      A huge export on the last day never changes the previous week's threshold: the window for
      week W ends on W's Sunday. 35 days of export 10 then one day of 1000 → the week before the
      last one keeps threshold 10 and all its days cloudy; the last week's threshold is still 10
      (quantile 0.30 of 27×10 + 1000) and its outlier day is not cloudy.
    model: rec_fair_community_days
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('rec_fair_daily')
        format: sql
        rows: |
          select 'd1' as device_id, 'rec' as community_id, d::date as local_day, 96 as n_slots, true as is_valid_day,
                 1.0::double precision as import_kwh,
                 case when d::date = date '2026-08-09' then 1000.0 else 10.0 end::double precision as export_kwh,
                 0.0::double precision as night_import_kwh, 36 as night_slots, 0.0::double precision as midday_import_kwh
          from generate_series(date '2026-07-06', date '2026-08-09', interval '1 day') as d
      - input: ref('rec_fair_device_registry')
        rows:
          - {device_id: 'd1', community_id: 'rec', quarantine_from: null}
    expect:
      rows:
        - {community_id: 'rec', local_day: '2026-07-06', week_start: '2026-07-06', cloudy_threshold_kwh: 10.0, is_cloudy: true}
        - {community_id: 'rec', local_day: '2026-07-07', week_start: '2026-07-06', cloudy_threshold_kwh: 10.0, is_cloudy: true}
        - {community_id: 'rec', local_day: '2026-07-08', week_start: '2026-07-06', cloudy_threshold_kwh: 10.0, is_cloudy: true}
        - {community_id: 'rec', local_day: '2026-07-09', week_start: '2026-07-06', cloudy_threshold_kwh: 10.0, is_cloudy: true}
        - {community_id: 'rec', local_day: '2026-07-10', week_start: '2026-07-06', cloudy_threshold_kwh: 10.0, is_cloudy: true}
        - {community_id: 'rec', local_day: '2026-07-11', week_start: '2026-07-06', cloudy_threshold_kwh: 10.0, is_cloudy: true}
