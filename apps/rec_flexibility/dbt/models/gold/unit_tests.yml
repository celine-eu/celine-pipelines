  # ─────────────────────────────────────────────────────────────────────────────
  # rec_fair_season_boards / rec_fair_anti_gaming_flags (fair gamification §4.5)
  # Season Sep–Oct 2026 (anchor 2025-09-01, 2 months): weeks Sep 7 … Oct 26; as_of pins elapsed weeks.
