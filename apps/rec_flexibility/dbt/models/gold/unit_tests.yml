          - {device_id: 'a', community_id: 'rec', week_start: '2026-09-14', season_start: '2026-09-01', is_valid_week: true, level_points: 60.0, growth_points: 40.0, actions_points: 5, weekly_points: 105.0}
          - {device_id: 'b', community_id: 'rec', week_start: '2026-09-07', season_start: '2026-09-01', is_valid_week: true, level_points: 20.0, growth_points: 20.0, actions_points: 0, weekly_points: 40.0}
          - {device_id: 'b', community_id: 'rec', week_start: '2026-09-14', season_start: '2026-09-01', is_valid_week: true, level_points: 20.0, growth_points: 20.0, actions_points: 0, weekly_points: 40.0}
      - input: ref('rec_fair_device_class')
