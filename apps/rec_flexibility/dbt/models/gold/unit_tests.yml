        - {device_id: 'b4', ref_group_effective: 'business/no_pv', ref_group_n: 0}
        - {device_id: 'b5', ref_group_effective: 'business/no_pv', ref_group_n: 0}
        - {device_id: 'b6', ref_group_effective: 'business/no_pv', ref_group_n: 0}
        - {device_id: 'b7', ref_group_effective: 'business/no_pv', ref_group_n: 0}
        - {device_id: 'b8', ref_group_effective: 'business/no_pv', ref_group_n: 0}
        - {device_id: 'b9', ref_group_effective: 'business/no_pv', ref_group_n: 0}
