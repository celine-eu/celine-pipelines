name: "energy_community"
version: "1.0.0"
config-version: 2
profile: "energy_community"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seed"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets: ["target", "dbt_packages", "logs"]

models:
  energy_community:
    staging:
      +materialized: view
      +schema: staging
    gold:
      +materialized: table
      +schema: gold

seeds:
  energy_community:
    +schema: staging
    weather_locations:
      # Always drop and recreate rather than truncate. A plain `dbt seed` keeps
      # the existing table's columns, so adding a column to the CSV fails the
      # insert on every environment seeded before the change (0.3.0 shipped
      # `elevation_m` this way). The seed is tiny and fully owned by the CSV;
      # the cascade drops `stg_weather_alerts`, which the staging step rebuilds.
      +full_refresh: true
      # Typed explicitly rather than inferred. `elevation_m` is optional — a
      # location that does not declare one still matches, it just cannot break a
      # coordinate tie — so most rows may be blank, and dbt-postgres infers an
      # all-blank column as `integer` in some cases and `text` in others. A text
      # column would make `abs(src.elevation_m - loc.elevation_m)` fail at run
      # time rather than at parse time.
      +column_types:
        elevation_m: integer
