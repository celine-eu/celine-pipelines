  - name: m7_growth_history_is_not_truncated_by_the_recompute_window
    description: >
      Six valid weeks of history, recompute window of 2: the two output weeks still see all six weeks
      (k = 5 → n = 2, k = 6 → n = 3) instead of being recomputed from a truncated past.
    model: rec_fair_weekly_metrics
    overrides:
      vars: {fair_as_of: '2026-10-09', fair_recompute_weeks: 2, fair_history_start: '2026-09-21'}
      macros:
        is_incremental: false
    given:
      - input: ref('rec_fair_daily')
        format: sql
        rows: |
          select 'd1' as device_id, 'rec' as community_id, d::date as local_day, 96 as n_slots, true as is_valid_day,
                 10.0::double precision as import_kwh, 0.0::double precision as export_kwh, 1.0::double precision as night_import_kwh,
                 36 as night_slots, 1.0::double precision as midday_import_kwh
          from generate_series(date '2026-08-24', date '2026-10-04', interval '1 day') as d
      - input: ref('rec_fair_community_days')
        rows: []
      - input: ref('rec_fair_device_class')
        format: sql
        rows: |
          select 'd1' as device_id, 'rec' as community_id, w::date as week_start, 'no_pv' as pv_class, 'household' as category,
                 'household/no_pv' as ref_group, false as is_quarantined, true as is_rankable
          from generate_series(date '2026-08-24', date '2026-09-28', interval '7 days') as w
    expect:
      rows:
        - {device_id: 'd1', week_start: '2026-09-21', growth_n: 2, import_median_8w: 70.0}
        - {device_id: 'd1', week_start: '2026-09-28', growth_n: 3, import_median_8w: 70.0}

