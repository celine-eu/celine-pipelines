        - {device_id: 'v1', ref_group: 'household/pv', ref_group_effective: 'household/pv', ref_group_n: 7}
        - {device_id: 'v2', ref_group: 'household/pv', ref_group_effective: 'household/pv', ref_group_n: 7}
