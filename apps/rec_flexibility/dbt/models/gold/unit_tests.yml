  - name: a5_surplus_hours_inside_the_commitment_earn_two_points_each
    description: >
      The substation of the device is in surplus at 13:00 and the device imports ≥110% of its baseline
      in that hour → one surplus hour, 2 points; the 14:00 hour is in surplus only at community level
      while the substation has a (non-surplus) row → not counted.
