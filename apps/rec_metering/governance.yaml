defaults:
  license: null
  ownership:
    - name: rec
      type: DATA_OWNER
  access_level: internal
  access_requirements: partner
  classification: green
  tags: []
  retention_days: 365
  documentation_url: null
  source_system: rec-metering
  dcat:
    themes:
      - http://publications.europa.eu/resource/authority/data-theme/ENER
    language_uris:
      - http://publications.europa.eu/resource/authority/language/ENG
    spatial_uris:
      - http://publications.europa.eu/resource/authority/country/ITA
    accrual_periodicity: http://publications.europa.eu/resource/authority/frequency/IRREG
  dataspace:
    odrl_action: use
    # Metering readings underpinning the community's own operation.
    purpose:
      - EnergyCommunityOperation

depends_on:
  - dataset: datasets.*_silver.meters_data_normalized
    external: true
    description: >
      Normalised meter readings. Produced by a deployment's own metering
      ingestion, which is not part of this repository; `dbt/models/gold/sources.yml`
      is the contract it must satisfy.

sources:
  # ---------------------------------------------------------------------------
  # OUTPUTS
  # ---------------------------------------------------------------------------

  datasets.ds_dev_gold.meters_data_15m: &meters_15m
    title: "Member Meter Readings, 15-minute (Gold)"
    description: >
      The community's sanctioned quarter-hour metering interface, and the table every other REC
      pipeline reads. One row per member device and fifteen-minute interval, deduplicated and
      summed from the normalised readings, holding the energy drawn from the grid, fed into the
      grid, and self-used behind the meter — all as kWh over the interval, with no kW
      conversion anywhere downstream. Self-use is published as the upstream computes it and is
      negative on a minority of rows; that is an upstream defect this dataset neither hides nor
      corrects. The population is the metered devices of the community. Personal data: a
      quarter-hour series describes the household behind the meter, so a caller sees only the
      devices the registry entitles them to.
    classification: pii
    tags: [meters, gold, aggregated]
    row_filters:
      - handler: rec_registry
        args:
          column: device_id
    expose: true
    dataspace:
      expose: false
      medallion: gold
      consent_required: true

  # The same readings, one quantity per row, mapped onto SOSA.
  #
  # `<<: *meters_15m` is load-bearing rather than tidiness. This view is a
  # projection of meters_data_15m and must be no more readable than it is: same
  # access level, same owners, same `rec_registry` filter on the same column.
  # Sharing the block by anchor makes the two one object in this file, so they
  # cannot drift apart — a semantic sibling that quietly lost its row filter
  # would serve every device's readings to every caller, and nothing downstream
  # would catch it. dataset-api applies whatever filters a dataset's own entry
  # declares; it never compares two datasets to each other.
  #
  # `device_id` survives into the view verbatim for the same reason: a filter
  # names a column, and nothing validates that the column exists on the table.
  # A view that dropped it would be served **unfiltered** rather than failing.
  datasets.ds_dev_gold.meters_measurements_15m:
    title: "Member Meter Readings, 15-minute — Observations (Gold)"
    description: >
      The quarter-hour meter readings expressed as one observation per row, the shape an
      observation vocabulary can describe: an observation carries exactly one observed
      property, so a reading holding three quantities side by side is up to three observations
      — grid import, grid export and behind-the-meter self-use, each with its own full property
      and unit IRI. The feature of interest is the device's connection point and the sensor is
      the meter that produced the reading. Same population, same interval and same per-device
      restriction as the readings it projects, and no aggregation: it adds shape, not figures.
    classification: pii
    <<: *meters_15m
    ontology:
      spec: obs_energy_measurement
    dcat:
      # The model's identity, which is SOSA's — not a CELINE IRI, and not this
      # deployment's /vocabulary locator. Every dataset bound to
      # obs_energy_measurement declares this same value; that is what lets a
      # consumer recognise two producers' feeds as one shape.
      conforms_to: http://www.w3.org/ns/sosa/

  datasets.ds_dev_gold.meters_data_1h:
    title: "Member Meter Readings, Hourly (Gold)"
    description: >
      The quarter-hour meter readings summed to the hour, one row per member device and hour,
      carrying energy drawn from and fed into the grid only — behind-the-meter self-use is not
      rolled up and stays at the quarter-hour grain. A test asserts these hourly figures match
      the quarter-hour readings they derive from, so a disagreement between the two is a
      failure rather than a rounding allowance. Same population and same per-device restriction
      as the quarter-hour readings.
    classification: pii
    tags: [meters, gold, aggregated]
    row_filters:
      - handler: rec_registry
        args:
          column: device_id
    expose: true
    dataspace:
      expose: false
      medallion: gold
      consent_required: true

  datasets.ds_dev_gold.meters_data_15m_missing_intervals:
    classification: pii
    tags: [meters, quality, gold]
    row_filters:
      - handler: rec_registry
        args:
          column: device_id
    expose: true
    dataspace:
      expose: false
      medallion: gold
      consent_required: true
