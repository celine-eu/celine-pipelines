        - {community_id: 'rec', local_day: '2026-07-15', week_start: '2026-07-13', cloudy_threshold_kwh: 10.0, is_cloudy: true}
        - {community_id: 'rec', local_day: '2026-07-16', week_start: '2026-07-13', cloudy_threshold_kwh: 10.0, is_cloudy: true}
        - {community_id: 'rec', local_day: '2026-07-17', week_start: '2026-07-13', cloudy_threshold_kwh: 10.0, is_cloudy: true}
        - {community_id: 'rec', local_day: '2026-07-18', week_start: '2026-07-13', cloudy_threshold_kwh: 10.0, is_cloudy: true}
        - {community_id: 'rec', local_day: '2026-07-19', week_start: '2026-07-13', cloudy_threshold_kwh: 10.0, is_cloudy: true}
        - {community_id: 'rec', local_day: '2026-07-20', week_start: '2026-07-20', cloudy_threshold_kwh: 10.0, is_cloudy: true}
