default_environment: prod
project_id: energy_community_platform

environments:
  - name: prod

plugins:
  extractors:
    - name: tap-openmeteo
      namespace: tap_openmeteo
      variant: celine-eu
      pip_url: git+https://github.com/celine-eu/tap-openmeteo.git@main
      capabilities:
        - discover
        - catalog
        - state
      config:
        api_url: "https://api.open-meteo.com"
        request_timeout: 120
        locations:
          - name: "Folgaria"
            latitude: 45.9167
            longitude: 11.1667
            timezone: "Europe/Rome"
        timezone: "Europe/Rome"
        # icon_seamless = ICON-D2 for the first ~48 h, ICON-EU beyond (plain
        # variable names, no nulls out to 72 h). Consumers forecast 48 h from
        # origins up to 12 h after a refresh; 72 h also survives one missed run.
        forecast_hours: 72
        past_hours: 120
        models:
          - icon_seamless
        hourly_variables:
          - shortwave_radiation
          - direct_radiation
          - diffuse_radiation
          - global_tilted_irradiance
          - cloud_cover
          - temperature_2m
          - precipitation
        streams_to_sync:
          - weather_hourly

    # The variables the weather facade's primary provider (mt) does not
    # publish: humidity, UV, cloud cover, sunrise and sunset. Open-Meteo's
    # best-match model, not icon_seamless: ICON returns no UV index. Two calls
    # per run (current + daily), riding the main om schedule.
    - name: tap-openmeteo-extras
      inherit_from: tap-openmeteo
      config:
        models: []
        current_variables:
          - relative_humidity_2m
          - uv_index
          - cloud_cover
        daily_variables:
          - uv_index_max
          - sunrise
          - sunset
        streams_to_sync:
          - weather_current
          - weather_daily
        # raw.weather_current / raw.weather_daily are generic names; keep the
        # provider in the table name, as raw.om_weather_* does elsewhere.
        stream_maps:
          weather_current:
            __alias__: om_weather_current
          weather_daily:
            __alias__: om_weather_daily

  loaders:
    - name: target-postgres
      variant: meltanolabs
      pip_url: meltanolabs-target-postgres
      config:
        host: ${POSTGRES_HOST}
        port: ${POSTGRES_PORT}
        user: ${POSTGRES_USER}
        password: ${POSTGRES_PASSWORD}
        database: ${POSTGRES_DB}
        default_target_schema: raw

jobs:
  - name: import
    tasks:
      - tap-openmeteo target-postgres
      - tap-openmeteo-extras target-postgres
