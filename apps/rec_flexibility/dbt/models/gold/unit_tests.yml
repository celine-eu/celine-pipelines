          - {community_id: 'example-rec', device_id: 'dev-cold', timestamp: '2024-06-01 10:00:00', total_consumption_kwh: 0.5, grid_import_kwh: null, period: 'forecast', data_missing: 0}
    expect:
      rows:
        - {device_id: 'dev-base', estimated_kwh: "1.20", reward_points_estimated: 11}
        - {device_id: 'dev-cold', estimated_kwh: "1.00", reward_points_estimated: 9}

  - name: w12_zero_spread_device_still_gets_nonzero_promise
    description: >
      A device with settlement baselines but zero shift_potential (constant profile)
      is promised its expected consumption only: 0.8 kWh -> 8 pts. Never zero -
      this is the structural-exclusion fix for prosumers.
    model: rec_flexibility_windows
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('rec_flexibility_windows_community')
        rows:
          - {community_id: 'example-rec', ts_date: '2024-06-01', window_start: '2024-06-01 09:00:00', window_end: '2024-06-01 11:00:00', community_kwh: 3.0, confidence: 0.75}
      - input: ref('rec_device_class')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01', is_m1_only: false}
      - input: ref('rec_device_baselines')
