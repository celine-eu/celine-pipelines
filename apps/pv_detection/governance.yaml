# Local only — run on demand against a local database, not deployed on a schedule.
# Its datasets stay catalogued; nothing new arrives unless someone runs it.
active: false

defaults:
  license: null
  ownership: []
  access_level: internal
  classification: green
  tags: []
  retention_days: 365
  documentation_url: null
  source_system: null
  attribution: null
  access_requirements: null
  dataspace:
    expose: false
    medallion: null
    contract_required: false
    consent_required: false
    odrl_action: use
    purpose: []
  dcat: null

depends_on:
  - dataset: datasets.*_silver.pv_overture_buildings
    description: Building footprints the vision model is run over.

sources:
  datasets.raw.pv_predictions:
    title: "PV Detection Predictions (Raw)"
    description: >
      Vision model predictions for PV panel presence on building rooftops.
      Produced by Ollama-based inference on aerial orthophoto tiles.
    source_system: ollama
    tags: [pv_detection, ml_inference]
    dataspace:
      medallion: bronze

  datasets.ds_dev_silver.pv_detections:
    title: "PV Detections (Silver)"
    description: >
      Deduplicated PV detection results per building. Latest prediction wins
      when a building is re-processed with a newer model or imagery.
    tags: [pv_detection]
    dataspace:
      medallion: silver
    dcat:
      # Bare codes were dropped on the floor here: the field names were wrong
      # (`language`/`spatial`, not `language_uris`/`spatial_uris`) so the model
      # ignored them, and DCAT wants IRIs rather than codes in any case.
      # ITH2 is Provincia Autonoma di Trento — the URI 27 other datasets use.
      themes:
        - http://publications.europa.eu/resource/authority/data-theme/ENER
        - http://publications.europa.eu/resource/authority/data-theme/REGI
      language_uris:
        - http://publications.europa.eu/resource/authority/language/ENG
      spatial_uris:
        - http://data.europa.eu/nuts/code/ITH2

  datasets.ds_dev_gold.pv_detected_installations:
    title: "PV Detected Installations"
    description: >
      Buildings with detected PV installations, enriched with Overture building
      geometry and metadata. Exposed for energy community planning.
    tags: [pv_detection, energy_planning]
    expose: true
    dataspace:
      expose: false
      medallion: gold
      contract_required: false
      consent_required: false
      purpose: [PVPotentialAssessment]
    dcat:
      themes:
        - http://publications.europa.eu/resource/authority/data-theme/ENER
        - http://publications.europa.eu/resource/authority/data-theme/REGI
      language_uris:
        - http://publications.europa.eu/resource/authority/language/ENG
      spatial_uris:
        - http://data.europa.eu/nuts/code/ITH2
