  - name: b1_first_week_and_min_weeks_reasons
    description: >
      as_of 2026-09-10 → no completed week → every device 'first_week'. as_of 2026-10-19 → 6 elapsed
      weeks, 3 required: a device with 2 valid weeks is 'min_weeks' and unranked.
    model: rec_fair_season_boards
    overrides:
      vars: {fair_as_of: '2026-10-19'}
      macros:
        is_incremental: false
    given:
      - input: ref('rec_fair_weekly_scores')
        rows:
          - {device_id: 'a', community_id: 'rec', week_start: '2026-09-07', season_start: '2026-09-01', is_valid_week: true, level_points: 50.0, growth_points: 50.0, actions_points: 0, weekly_points: 100.0}
          - {device_id: 'a', community_id: 'rec', week_start: '2026-09-14', season_start: '2026-09-01', is_valid_week: true, level_points: 50.0, growth_points: 50.0, actions_points: 0, weekly_points: 100.0}
