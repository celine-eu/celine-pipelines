      - input: ref('rec_fair_meters_15m')
        format: sql
        rows: |
          select 'd1' as device_id, 'rec' as community_id, 'A' as substation_id,
                 timestamptz '2026-10-01 13:00:00+02' + q * interval '15 minutes' as ts, 52 + q as slot, true as is_weekday,
                 0.2::double precision as import_kwh, 0.0::double precision as export_kwh from generate_series(0, 3) as q
          union all
          select 'd2', 'rec', 'A', timestamptz '2026-10-01 13:00:00+02' + q * interval '15 minutes', 52 + q, true, 0.275, 0.0 from generate_series(0, 3) as q
      - input: ref('rec_fair_import_baseline')
