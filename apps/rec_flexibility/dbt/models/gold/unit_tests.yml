  - name: c6_adherence_ratio_is_populated_for_settled_commitment
    description: >
      A settled commitment with reward_points_actual = reward_points_estimated yields
      adherence_ratio = 1.0 (full delivery). Under-budget scenario: allocated = actual.
    model: rec_commitment_settlement
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('silver_flexibility_commitments')
        rows:
          - {commitment_id: 'c-01', device_id: 'dev-01', suggestion_id: 's-01',
             suggestion_type: 'solar_overproduction', community_id: 'com-01',
             period_start: '2024-06-01 09:00:00', period_end: '2024-06-01 12:00:00',
             status: 'settled', reward_points_estimated: 30,
             committed_at: '2024-06-01 08:00:00', settled_at: '2024-06-01 13:00:00',
             last_updated: '2024-06-01 13:00:00'}
      - input: ref('rec_settlement_1h')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01', ts: '2024-06-01 09:00:00', consumption_kwh: 3.0, window_start: '2024-06-01 09:00:00'}
      - input: ref('rec_flexibility_windows')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01', window_start: '2024-06-01 09:00:00', window_end: '2024-06-01 12:00:00', community_kwh: 5.0}
      - input: ref('rec_settlement_points')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01', ts: '2024-06-01 09:00:00', settlement_points: 10.0}
          - {community_id: 'example-rec', device_id: 'dev-01', ts: '2024-06-01 10:00:00', settlement_points: 10.0}
          - {community_id: 'example-rec', device_id: 'dev-01', ts: '2024-06-01 11:00:00', settlement_points: 10.0}
      - input: ref('rec_flexibility_bonus')
        rows: []
    expect:
      rows:
        - {commitment_id: 'c-01', reward_points_actual: 30}

  # ─────────────────────────────────────────────────────────────────────────────
  # rec_settlement_15m
  # ─────────────────────────────────────────────────────────────────────────────

  - name: s1_interval_inside_window_has_window_context_populated
    description: >
      A 15-min interval whose ts falls within a flexibility window must have window_start
      and window_end populated, and consumption_kwh passed through unchanged (already kWh).
    model: rec_settlement_15m
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('rec_meters_15m')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01', ts: '2024-06-01 09:30:00', consumption_kwh: 2.0}
      - input: ref('rec_flexibility_windows')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01', window_start: '2024-06-01 09:00:00', window_end: '2024-06-01 12:00:00',
             ts_date: '2024-06-01', estimated_kwh: 3.0, reward_points_estimated: 30}
    expect:
      rows:
        - {device_id: 'dev-01', ts: '2024-06-01 09:30:00', consumption_kwh: 2.0,
           window_start: '2024-06-01 09:00:00', window_end: '2024-06-01 12:00:00'}

  - name: s2_interval_outside_window_has_null_window_context
    description: >
      A 15-min interval outside all flexibility windows must have window_start = NULL
      (LEFT JOIN preserves all metered intervals).
    model: rec_settlement_15m
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('rec_meters_15m')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01', ts: '2024-06-01 14:00:00', consumption_kwh: 1.0}
      - input: ref('rec_flexibility_windows')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01', window_start: '2024-06-01 09:00:00', window_end: '2024-06-01 12:00:00',
             ts_date: '2024-06-01', estimated_kwh: 3.0, reward_points_estimated: 30}
    expect:
      rows:
        - {device_id: 'dev-01', ts: '2024-06-01 14:00:00', consumption_kwh: 1.0, window_start: null}

  - name: s3_consumption_kwh_passes_through_without_unit_conversion
    description: >
      rec_meters_15m already delivers kWh per 15-min bucket; rec_settlement_15m must
      NOT rescale it. 2.0 kWh → 2.0 kWh, 4.0 kWh → 4.0 kWh.
    model: rec_settlement_15m
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('rec_meters_15m')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01', ts: '2024-06-01 09:00:00', consumption_kwh: 2.0}
          - {community_id: 'example-rec', device_id: 'dev-01', ts: '2024-06-01 09:15:00', consumption_kwh: 4.0}
      - input: ref('rec_flexibility_windows')
        rows: []
    expect:
      rows:
        - {device_id: 'dev-01', ts: '2024-06-01 09:00:00', consumption_kwh: 2.0}
        - {device_id: 'dev-01', ts: '2024-06-01 09:15:00', consumption_kwh: 4.0}

  - name: s4_interval_matching_two_windows_keeps_earliest_window_start
    description: >
      When a 15-min interval falls inside two overlapping windows, DISTINCT ON keeps the
      row with the earliest window_start (order by window_start nulls last).
    model: rec_settlement_15m
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('rec_meters_15m')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01', ts: '2024-06-01 09:30:00', consumption_kwh: 2.0}
      - input: ref('rec_flexibility_windows')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01', window_start: '2024-06-01 08:00:00', window_end: '2024-06-01 12:00:00',
             ts_date: '2024-06-01', estimated_kwh: 4.0, reward_points_estimated: 40}
          - {community_id: 'example-rec', device_id: 'dev-01', window_start: '2024-06-01 09:00:00', window_end: '2024-06-01 11:00:00',
             ts_date: '2024-06-01', estimated_kwh: 2.0, reward_points_estimated: 20}
    expect:
      rows:
        - {device_id: 'dev-01', ts: '2024-06-01 09:30:00', window_start: '2024-06-01 08:00:00'}

  # ─────────────────────────────────────────────────────────────────────────────
  # rec_gamification_summary
  # ─────────────────────────────────────────────────────────────────────────────

  - name: g1_passive_device_receives_share_of_remaining_budget
    description: >
      Committed device (dev-01) consumes 2.0 kWh, allocated 2.0 in rec_commitment_settlement.
      Remaining budget = 5.0 − 2.0 = 3.0.
      Passive devices dev-02 (1.0 kWh) and dev-03 (2.0 kWh) → total passive = 3.0 ≤ remaining.
      Each passive device keeps its full consumption as allocated_kwh.
    model: rec_gamification_summary
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('rec_settlement_15m')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01', ts: '2024-06-01 09:30:00', ts_date: '2024-06-01', window_start: '2024-06-01 09:00:00', window_end: '2024-06-01 12:00:00', consumption_kwh: 2.0}
          - {community_id: 'example-rec', device_id: 'dev-02', ts: '2024-06-01 09:30:00', ts_date: '2024-06-01', window_start: '2024-06-01 09:00:00', window_end: '2024-06-01 12:00:00', consumption_kwh: 1.0}
          - {community_id: 'example-rec', device_id: 'dev-03', ts: '2024-06-01 09:30:00', ts_date: '2024-06-01', window_start: '2024-06-01 09:00:00', window_end: '2024-06-01 12:00:00', consumption_kwh: 2.0}
      - input: ref('silver_flexibility_commitments')
        rows:
          - {device_id: 'dev-01', committed_at: '2024-06-01 08:00:00', status: 'committed'}
      - input: ref('rec_commitment_settlement')
        rows:
          - {community_id: 'example-rec', period_start: '2024-06-01 09:00:00', period_end: '2024-06-01 12:00:00', allocated_kwh: 2.0, status: 'committed'}
      - input: ref('rec_flexibility_windows')
        rows:
          - {community_id: 'example-rec', window_start: '2024-06-01 09:00:00', window_end: '2024-06-01 12:00:00', community_kwh: 5.0, device_id: 'dev-01'}
    expect:
      rows:
        - {device_id: 'dev-01', ts_date: '2024-06-01', committed: true,  total_consumption_kwh: 2.0, total_allocated_kwh: 0.0}
        - {device_id: 'dev-02', ts_date: '2024-06-01', committed: false, total_consumption_kwh: 1.0, total_allocated_kwh: 1.0}
        - {device_id: 'dev-03', ts_date: '2024-06-01', committed: false, total_consumption_kwh: 2.0, total_allocated_kwh: 2.0}

  - name: g2_passive_devices_get_zero_when_committed_exhaust_budget
    description: >
      Committed devices together consume exactly community_kwh (remaining = 0).
      Passive device dev-02 must receive total_allocated_kwh = 0.
    model: rec_gamification_summary
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('rec_settlement_15m')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01', ts: '2024-06-01 09:30:00', ts_date: '2024-06-01', window_start: '2024-06-01 09:00:00', window_end: '2024-06-01 12:00:00', consumption_kwh: 3.0}
          - {community_id: 'example-rec', device_id: 'dev-02', ts: '2024-06-01 09:30:00', ts_date: '2024-06-01', window_start: '2024-06-01 09:00:00', window_end: '2024-06-01 12:00:00', consumption_kwh: 1.0}
      - input: ref('silver_flexibility_commitments')
        rows:
          - {device_id: 'dev-01', committed_at: '2024-06-01 08:00:00', status: 'committed'}
      - input: ref('rec_commitment_settlement')
        rows:
          - {community_id: 'example-rec', period_start: '2024-06-01 09:00:00', period_end: '2024-06-01 12:00:00', allocated_kwh: 3.0, status: 'committed'}
      - input: ref('rec_flexibility_windows')
        rows:
          - {community_id: 'example-rec', window_start: '2024-06-01 09:00:00', window_end: '2024-06-01 12:00:00', community_kwh: 3.0, device_id: 'dev-01'}
    expect:
      rows:
        - {device_id: 'dev-01', committed: true,  total_allocated_kwh: 0.0}
        - {device_id: 'dev-02', committed: false, total_allocated_kwh: 0.0}

  - name: g3_passive_proportional_cap
    description: >
      remaining_budget = 5.0 − 3.0 = 2.0.
      dev-02 (1.0 kWh) + dev-03 (3.0 kWh) → passive_total = 4.0 > remaining = 2.0.
      dev-02: 1.0/4.0×2.0 = 0.5, dev-03: 3.0/4.0×2.0 = 1.5.
    model: rec_gamification_summary
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('rec_settlement_15m')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01', ts: '2024-06-01 09:30:00', ts_date: '2024-06-01', window_start: '2024-06-01 09:00:00', window_end: '2024-06-01 12:00:00', consumption_kwh: 2.0}
          - {community_id: 'example-rec', device_id: 'dev-02', ts: '2024-06-01 09:30:00', ts_date: '2024-06-01', window_start: '2024-06-01 09:00:00', window_end: '2024-06-01 12:00:00', consumption_kwh: 1.0}
          - {community_id: 'example-rec', device_id: 'dev-03', ts: '2024-06-01 09:30:00', ts_date: '2024-06-01', window_start: '2024-06-01 09:00:00', window_end: '2024-06-01 12:00:00', consumption_kwh: 3.0}
      - input: ref('silver_flexibility_commitments')
        rows:
          - {device_id: 'dev-01', committed_at: '2024-06-01 08:00:00', status: 'committed'}
      - input: ref('rec_commitment_settlement')
        rows:
          - {community_id: 'example-rec', period_start: '2024-06-01 09:00:00', period_end: '2024-06-01 12:00:00', allocated_kwh: 3.0, status: 'committed'}
      - input: ref('rec_flexibility_windows')
        rows:
          - {community_id: 'example-rec', window_start: '2024-06-01 09:00:00', window_end: '2024-06-01 12:00:00', community_kwh: 5.0, device_id: 'dev-01'}
    expect:
      rows:
        - {device_id: 'dev-01', committed: true,  total_allocated_kwh: 0.0}
        - {device_id: 'dev-02', committed: false, total_allocated_kwh: 0.5}
        - {device_id: 'dev-03', committed: false, total_allocated_kwh: 1.5}

  # ─────────────────────────────────────────────────────────────────────────────
  # rec_participant_points — season tagging
  # ─────────────────────────────────────────────────────────────────────────────

  - name: pp1_daily_rows_tagged_with_calendar_aligned_season
    description: >
      Each daily row is tagged with season_start = start of its 2-month calendar season
      anchored at 2025-09-01. 2025-09-15 → 2025-09-01 (Sep-Oct); 2025-11-05 → 2025-11-01
      (Nov-Dec); 2026-05-28 → 2026-05-01 (May-Jun).
    model: rec_participant_points
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('rec_settlement_points')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01', ts: '2025-09-15 09:00:00', consumption_kwh: 1.0, settlement_points: 10}
          - {community_id: 'example-rec', device_id: 'dev-01', ts: '2025-11-05 09:00:00', consumption_kwh: 1.0, settlement_points: 20}
          - {community_id: 'example-rec', device_id: 'dev-01', ts: '2026-05-28 09:00:00', consumption_kwh: 1.0, settlement_points: 30}
      - input: ref('rec_flexibility_bonus')
        rows: []
    expect:
      rows:
        - {device_id: 'dev-01', ts_date: '2025-09-15', season_start: '2025-09-01', daily_settlement_points: 10}
        - {device_id: 'dev-01', ts_date: '2025-11-05', season_start: '2025-11-01', daily_settlement_points: 20}
        - {device_id: 'dev-01', ts_date: '2026-05-28', season_start: '2026-05-01', daily_settlement_points: 30}

  # ─────────────────────────────────────────────────────────────────────────────
  # rec_points_leaderboard — seasonal reset + private all-time totals
  # ─────────────────────────────────────────────────────────────────────────────

  - name: lb1_points_reset_per_season_and_alltime_is_cumulative
    description: >
      Each (device, season) is a separate row, so displayed season points reset at every
      season boundary. The private all-time columns sum across ALL of a device's seasons
      (never reset) and are identical on every one of that device's rows. all-time is
      per-device (partition), so dev-02 is independent of dev-01.
    model: rec_points_leaderboard
    given:
      - input: ref('rec_participant_points')
        rows:
          # dev-01, season Sep-Oct 2025
          - {community_id: 'example-rec', device_id: 'dev-01', ts_date: '2025-09-15', season_start: '2025-09-01', daily_settlement_points: 10, daily_bonus_points: 3, daily_points: 13}
          - {community_id: 'example-rec', device_id: 'dev-01', ts_date: '2025-10-02', season_start: '2025-09-01', daily_settlement_points: 20, daily_bonus_points: 2, daily_points: 22}
          # dev-01, season Nov-Dec 2025
          - {community_id: 'example-rec', device_id: 'dev-01', ts_date: '2025-11-05', season_start: '2025-11-01', daily_settlement_points: 40, daily_bonus_points: 0, daily_points: 40}
          # dev-02, single season
          - {community_id: 'example-rec', device_id: 'dev-02', ts_date: '2025-09-20', season_start: '2025-09-01', daily_settlement_points: 5, daily_bonus_points: 1, daily_points: 6}
      - input: source('rec_registry_gold', 'rec_device_membership')
        rows: []
    expect:
      rows:
        - {device_id: 'dev-01', season_start: '2025-09-01', season_base_points: 30, season_bonus_points: 5, season_points: 35, alltime_base_points: 70, alltime_bonus_points: 5}
        - {device_id: 'dev-01', season_start: '2025-11-01', season_base_points: 40, season_bonus_points: 0, season_points: 40, alltime_base_points: 70, alltime_bonus_points: 5}
        - {device_id: 'dev-02', season_start: '2025-09-01', season_base_points: 5, season_bonus_points: 1, season_points: 6, alltime_base_points: 5, alltime_bonus_points: 1}

  - name: lb2_pre_anchor_points_excluded_from_alltime
    description: >
      Points dated before the season anchor (2025-09-01) fall in a pre-anchor season and
      must be excluded entirely — no row for them, and they do NOT inflate the private
      all-time totals. Only the 2025-09-01 season survives here.
    model: rec_points_leaderboard
    given:
      - input: ref('rec_participant_points')
        rows:
          # pre-anchor (2025-07-01 season) — must be dropped
          - {community_id: 'example-rec', device_id: 'dev-01', ts_date: '2025-08-26', season_start: '2025-07-01', daily_settlement_points: 99, daily_bonus_points: 9, daily_points: 108}
          # in-program season
          - {community_id: 'example-rec', device_id: 'dev-01', ts_date: '2025-09-15', season_start: '2025-09-01', daily_settlement_points: 10, daily_bonus_points: 2, daily_points: 12}
      - input: source('rec_registry_gold', 'rec_device_membership')
        rows: []
    expect:
      rows:
        - {device_id: 'dev-01', season_start: '2025-09-01', season_base_points: 10, season_bonus_points: 2, season_points: 12, alltime_base_points: 10, alltime_bonus_points: 2}

  - name: lb3_fleet_complete_current_season_ranked_ties_zero_fill
    description: >
      Current season is fleet-complete: every rec_device_membership device gets a row,
      0-filled when it earned nothing, ranked (rank() ties share a rank, 0-point devices
      tie last), total_members = fleet size, season_end = season_start + season_months.
    model: rec_points_leaderboard
    overrides:
      macros:
        rec_season_start: "cast('2025-11-01' as date)"
    given:
      - input: ref('rec_participant_points')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01', ts_date: '2025-11-05', season_start: '2025-11-01', daily_settlement_points: 25, daily_bonus_points: 5, daily_points: 30}
          - {community_id: 'example-rec', device_id: 'dev-02', ts_date: '2025-11-06', season_start: '2025-11-01', daily_settlement_points: 18, daily_bonus_points: 2, daily_points: 20}
          - {community_id: 'example-rec', device_id: 'dev-03', ts_date: '2025-11-07', season_start: '2025-11-01', daily_settlement_points: 15, daily_bonus_points: 5, daily_points: 20}
      - input: source('rec_registry_gold', 'rec_device_membership')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01'}
          - {community_id: 'example-rec', device_id: 'dev-02'}
          - {community_id: 'example-rec', device_id: 'dev-03'}
          - {community_id: 'example-rec', device_id: 'dev-04'}
    expect:
      rows:
        - {device_id: 'dev-01', season_start: '2025-11-01', season_end: '2026-01-01', season_base_points: 25, season_bonus_points: 5, season_points: 30, season_rank: 1, total_members: 4, is_current_season: true}
        - {device_id: 'dev-02', season_start: '2025-11-01', season_end: '2026-01-01', season_base_points: 18, season_bonus_points: 2, season_points: 20, season_rank: 2, total_members: 4, is_current_season: true}
        - {device_id: 'dev-03', season_start: '2025-11-01', season_end: '2026-01-01', season_base_points: 15, season_bonus_points: 5, season_points: 20, season_rank: 2, total_members: 4, is_current_season: true}
        - {device_id: 'dev-04', season_start: '2025-11-01', season_end: '2026-01-01', season_base_points: 0, season_bonus_points: 0, season_points: 0, season_rank: 4, total_members: 4, is_current_season: true}

  - name: lb4_past_seasons_earned_only_removed_device_keeps_history
    description: >
      Past seasons are NOT retro-filled from the fleet: their rows and total_members count
      only devices that actually earned. A device no longer in the fleet (dev-99) keeps its
      past-season row but gets no current-season row.
    model: rec_points_leaderboard
    overrides:
      macros:
        rec_season_start: "cast('2025-11-01' as date)"
    given:
      - input: ref('rec_participant_points')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01', ts_date: '2025-09-15', season_start: '2025-09-01', daily_settlement_points: 10, daily_bonus_points: 0, daily_points: 10}
          - {community_id: 'example-rec', device_id: 'dev-99', ts_date: '2025-09-20', season_start: '2025-09-01', daily_settlement_points: 40, daily_bonus_points: 5, daily_points: 45}
      - input: source('rec_registry_gold', 'rec_device_membership')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01'}
    expect:
      rows:
        - {device_id: 'dev-99', season_start: '2025-09-01', season_points: 45, season_rank: 1, total_members: 2, is_current_season: false}
        - {device_id: 'dev-01', season_start: '2025-09-01', season_points: 10, season_rank: 2, total_members: 2, is_current_season: false}
        - {device_id: 'dev-01', season_start: '2025-11-01', season_points: 0, season_rank: 1, total_members: 1, is_current_season: true}

  - name: lb5_alltime_totals_unchanged_by_zero_fill
    description: >
      The private all-time columns are lifetime sums over EARNED rows only: a 0-filled
      current-season row neither resets nor inflates them, and a fleet device with no
      history has alltime = 0.
    model: rec_points_leaderboard
    overrides:
      macros:
        rec_season_start: "cast('2025-11-01' as date)"
    given:
      - input: ref('rec_participant_points')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01', ts_date: '2025-09-15', season_start: '2025-09-01', daily_settlement_points: 10, daily_bonus_points: 2, daily_points: 12}
      - input: source('rec_registry_gold', 'rec_device_membership')
        rows:
          - {community_id: 'example-rec', device_id: 'dev-01'}
          - {community_id: 'example-rec', device_id: 'dev-02'}
    expect:
      rows:
        - {device_id: 'dev-01', season_start: '2025-09-01', season_points: 12, alltime_base_points: 10, alltime_bonus_points: 2, is_current_season: false}
        - {device_id: 'dev-01', season_start: '2025-11-01', season_points: 0, alltime_base_points: 10, alltime_bonus_points: 2, is_current_season: true}
        - {device_id: 'dev-02', season_start: '2025-11-01', season_points: 0, alltime_base_points: 0, alltime_bonus_points: 0, is_current_season: true}


  # ─────────────────────────────────────────────────────────────────────────────
  # One community never sees another's figures
  # ─────────────────────────────────────────────────────────────────────────────

  - name: pc1_same_bounds_two_communities_keep_own_windows
    description: >
      Two communities each forecast a 2-hour surplus with the same bounds on the same day.
      Each keeps its own window, with its own community_kwh, from its own latest forecast
      generation; the _id is the same for both (it hashes only the day and the bounds), so
      the merge key and the uniqueness check are (community_id, _id).
    model: rec_flexibility_windows_community
    overrides:
      macros:
        is_incremental: false
    given:
      - input: source('meters_gold', 'total_meters_forecast')
        rows:
          - {community_id: 'example-rec', timestamp: '2024-06-01 10:00:00', net_exchange_kwh: 1.0, period: 'forecast', generated_at: '2024-06-01 00:00:00'}
          - {community_id: 'example-rec', timestamp: '2024-06-01 11:00:00', net_exchange_kwh: 1.0, period: 'forecast', generated_at: '2024-06-01 00:00:00'}
          - {community_id: 'other-rec', timestamp: '2024-06-01 10:00:00', net_exchange_kwh: 4.0, period: 'forecast', generated_at: '2024-05-31 00:00:00'}
          - {community_id: 'other-rec', timestamp: '2024-06-01 11:00:00', net_exchange_kwh: 4.0, period: 'forecast', generated_at: '2024-05-31 00:00:00'}
    expect:
      rows:
        - {community_id: 'example-rec', window_start: '2024-06-01 10:00:00', window_end: '2024-06-01 12:00:00', community_kwh: "2.00"}
        - {community_id: 'other-rec', window_start: '2024-06-01 10:00:00', window_end: '2024-06-01 12:00:00', community_kwh: "8.00"}

  - name: pc2_leaderboard_ranks_and_counts_within_one_community
    description: >
      Ranks and total_members are computed within one community and season: the top
      device of each community ranks 1, and each community counts only its own members
      (every membership device, 0-filled).
    model: rec_points_leaderboard
    overrides:
      macros:
        rec_season_start: "cast('2025-11-01' as date)"
    given:
      - input: ref('rec_participant_points')
        rows:
          - {community_id: 'example-rec', device_id: 'ex-00001', ts_date: '2025-11-05', season_start: '2025-11-01', daily_settlement_points: 50, daily_bonus_points: 0, daily_points: 50}
          - {community_id: 'example-rec', device_id: 'ex-00002', ts_date: '2025-11-05', season_start: '2025-11-01', daily_settlement_points: 10, daily_bonus_points: 0, daily_points: 10}
          - {community_id: 'other-rec', device_id: 'ex-00003', ts_date: '2025-11-05', season_start: '2025-11-01', daily_settlement_points: 20, daily_bonus_points: 0, daily_points: 20}
      - input: source('rec_registry_gold', 'rec_device_membership')
        rows:
          - {community_id: 'example-rec', device_id: 'ex-00001'}
          - {community_id: 'example-rec', device_id: 'ex-00002'}
          - {community_id: 'other-rec', device_id: 'ex-00003'}
          - {community_id: 'other-rec', device_id: 'ex-00004'}
    expect:
      rows:
        - {community_id: 'example-rec', device_id: 'ex-00001', season_rank: 1, total_members: 2}
        - {community_id: 'example-rec', device_id: 'ex-00002', season_rank: 2, total_members: 2}
        - {community_id: 'other-rec', device_id: 'ex-00003', season_rank: 1, total_members: 2}
        - {community_id: 'other-rec', device_id: 'ex-00004', season_rank: 2, total_members: 2}

  - name: pc3_commitment_settles_on_its_measured_community_budget
    description: >
      Two communities share window bounds with different budgets. A commitment whose
      flexibility-service community is wrong ('com-01') is settled on the budget of the
      community its device's measurements carry, and the row reports that community.
      Its actual (3.0 kWh) exceeds no budget of its own community (5.0), so it keeps it;
      the other community's 1.0 kWh budget would have cut it.
    model: rec_commitment_settlement
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('silver_flexibility_commitments')
        rows:
          - {commitment_id: 'c-01', device_id: 'ex-00001', suggestion_id: 's-01',
             suggestion_type: 'solar_overproduction', community_id: 'com-01',
             period_start: '2024-06-01 09:00:00', period_end: '2024-06-01 12:00:00',
             status: 'committed', reward_points_estimated: 30,
             committed_at: '2024-06-01 08:00:00', last_updated: '2024-06-01 13:00:00'}
      - input: ref('rec_settlement_1h')
        rows:
          - {community_id: 'example-rec', device_id: 'ex-00001', ts: '2024-06-01 09:00:00', consumption_kwh: 1.0, window_start: '2024-06-01 09:00:00'}
          - {community_id: 'example-rec', device_id: 'ex-00001', ts: '2024-06-01 10:00:00', consumption_kwh: 1.0, window_start: '2024-06-01 09:00:00'}
          - {community_id: 'example-rec', device_id: 'ex-00001', ts: '2024-06-01 11:00:00', consumption_kwh: 1.0, window_start: '2024-06-01 09:00:00'}
      - input: ref('rec_flexibility_windows')
        rows:
          - {community_id: 'example-rec', device_id: 'ex-00001', window_start: '2024-06-01 09:00:00', window_end: '2024-06-01 12:00:00', community_kwh: 5.0}
          - {community_id: 'other-rec', device_id: 'ex-00009', window_start: '2024-06-01 09:00:00', window_end: '2024-06-01 12:00:00', community_kwh: 1.0}
      - input: ref('rec_settlement_points')
        rows: []
      - input: ref('rec_flexibility_bonus')
        rows: []
    expect:
      rows:
        - {commitment_id: 'c-01', community_id: 'example-rec', actual_kwh: 3.0, allocated_kwh: 3.0}

  # ─────────────────────────────────────────────────────────────────────────────
  # rec_fair_device_registry (fair gamification, spec 2026-10-07 §4.2/§4.7)
  # ─────────────────────────────────────────────────────────────────────────────

  - name: r1_category_mapping_and_override_precedence
    description: >
      member_type maps schema:Person → household, schema:GovernmentOrganization and
      schema:Organization → public_entity, schema:LocalBusiness → business; a
      category_override wins and is flagged as such.
    model: rec_fair_device_registry
    given:
      - input: source('metering_silver', 'meters_data')
        rows:
          - {device_id: 'dev-p', cf_type: 'CF2', ts: '2026-09-01 10:00:00+00', meter_type: 'M1', consumption_kwh: 0.1, production_kwh: 0.0}
          - {device_id: 'dev-g', cf_type: 'CF4', ts: '2026-09-01 10:00:00+00', meter_type: 'M1', consumption_kwh: 0.1, production_kwh: 0.0}
          - {device_id: 'dev-o', cf_type: 'CF1', ts: '2026-09-01 10:00:00+00', meter_type: 'M1', consumption_kwh: 0.1, production_kwh: 0.0}
          - {device_id: 'dev-b', cf_type: 'CF3', ts: '2026-09-01 10:00:00+00', meter_type: 'M1', consumption_kwh: 0.1, production_kwh: 0.0}
      - input: source('rec_registry_gold', 'rec_device_membership')
        rows:
          - {community_id: 'rec', device_id: 'dev-p', role: 'consumer', member_type: 'schema:Person', substation_id: 'S1'}
          - {community_id: 'rec', device_id: 'dev-g', role: 'prosumer', member_type: 'schema:GovernmentOrganization', substation_id: 'S1'}
          - {community_id: 'rec', device_id: 'dev-o', role: 'consumer', member_type: 'schema:Organization', substation_id: 'S2'}
          - {community_id: 'rec', device_id: 'dev-b', role: 'consumer', member_type: 'schema:LocalBusiness', substation_id: 'S2'}
      - input: ref('rec_device_overrides')
        rows:
          - {device_id: 'dev-b', pv_class_override: null, category_override: 'household', quarantine_from: null, quarantine_reason: null, battery_declared: true}
    expect:
      rows:
        - {device_id: 'dev-p', category: 'household', category_source: 'registry', is_in_app: true, battery_declared: false}
        - {device_id: 'dev-g', category: 'public_entity', category_source: 'registry', is_in_app: true, battery_declared: false}
        - {device_id: 'dev-o', category: 'public_entity', category_source: 'registry', is_in_app: true, battery_declared: false}
        - {device_id: 'dev-b', category: 'household', category_source: 'override', is_in_app: true, battery_declared: true}

  - name: r2_unregistered_device_default_community_unknown_category
    description: >
      A device with M1 data but no membership row is kept, not in app, category unknown; with no
      members at all and an explicit default community var, it takes that community.
    model: rec_fair_device_registry
    overrides:
      vars: {fair_default_community_id: 'unknown'}
    given:
      - input: source('metering_silver', 'meters_data')
        rows:
          - {device_id: 'dev-x', cf_type: 'CF1', ts: '2026-09-01 10:00:00+00', meter_type: 'M1', consumption_kwh: 0.1, production_kwh: 0.0}
          - {device_id: 'dev-m2', cf_type: 'CF101', ts: '2026-09-01 10:00:00+00', meter_type: 'M2', consumption_kwh: 0.0, production_kwh: 0.5}
      - input: source('rec_registry_gold', 'rec_device_membership')
        rows: []
      - input: ref('rec_device_overrides')
        rows: []
    expect:
      rows:
        - {device_id: 'dev-x', community_id: 'unknown', is_in_app: false, category: 'unknown', category_source: 'none'}

  - name: r4_unregistered_device_falls_back_to_the_most_common_community
    description: With the default community var empty, an unregistered device joins the community most members belong to.
    model: rec_fair_device_registry
    overrides:
      vars: {fair_default_community_id: ''}
    given:
      - input: source('metering_silver', 'meters_data')
        rows:
          - {device_id: 'dev-x', cf_type: 'CF1', ts: '2026-09-01 10:00:00+00', meter_type: 'M1', consumption_kwh: 0.1, production_kwh: 0.0}
          - {device_id: 'dev-a', cf_type: 'CF1', ts: '2026-09-01 10:00:00+00', meter_type: 'M1', consumption_kwh: 0.1, production_kwh: 0.0}
          - {device_id: 'dev-b', cf_type: 'CF1', ts: '2026-09-01 10:00:00+00', meter_type: 'M1', consumption_kwh: 0.1, production_kwh: 0.0}
