defaults:
  license: null
  ownership:
    - name: dso
      type: DATA_OWNER
  access_level: internal
  access_requirements: partner
  classification: green
  tags: []
  retention_days: 365
  documentation_url: null
  source_system: grid-pipeline
  dcat:
    themes:
      - http://publications.europa.eu/resource/authority/data-theme/ENER
    language_uris:
      - http://publications.europa.eu/resource/authority/language/ENG
    spatial_uris:
      - http://publications.europa.eu/resource/authority/country/ITA
    accrual_periodicity: http://publications.europa.eu/resource/authority/frequency/DAILY
  dataspace:
    odrl_action: use

depends_on:
  - dataset: datasets.*_gold.om_wind_gusts
    description: Wind gust forecasts behind the wind risk models.
  - dataset: datasets.*_gold.om_wind_gusts_8h
    description: The same gust forecasts on 8-hour windows, behind the intra-day view.
  - dataset: datasets.*_gold.om_heat_risk
    description: >
      Heat risk forecasts, the air axis of the heat vector. Stores the lat/lon
      the weather API snapped the request to, so it is matched to the soil table
      by nearest geoposition, never by coordinate equality.
  - dataset: datasets.*_gold.om_soil_heat_risk
    description: >
      Soil temperature risk (1 m soil temperature against its own 7-day P90), the
      soil axis of the heat vector. Grain: one row per requested grid point per
      date.
  - dataset: datasets.*_silver.om_obs_15min
    description: Sub-hourly observations behind the nowcasting flow.
  - dataset: datasets.*_gold.heat_daily_obs
    description: >
      Daily heat observations. Published under this alias by `mt`, so a search
      for the filename finds nothing — grep the alias, not the model name.
  - dataset: datasets.*_silver.silver_grid_ac_line_segment
    external: true
    description: >
      CIM line segments, including the `strike_tree_*` columns. Produced by a
      deployment's own CIM ingestion; `dbt/models/sources.yml` is the contract.
  - dataset: datasets.*_silver.silver_grid_substation
    external: true
    description: CIM substations, from the same deployment ingestion.
  - dataset: datasets.*_silver.silver_grid_geo_tree_strike
    external: true
    description: >
      Tree-strike exposure spans (LiDAR analysis export), from the same deployment
      ingestion; drawn as their own overlay by grid_tree_strike_spans.
  - dataset: datasets.*_silver.silver_grid_geo_thermal_joints
    external: true
    description: >
      Thermal model of the MT cable joints (tier, margin, insulation class,
      technology, laying year), from the same deployment ingestion. The joint
      asset family of grid_shapes and of the heat risk tables.
  - dataset: datasets.*_silver.silver_grid_geo_thermal_cables
    external: true
    description: >
      Thermal model of the MT cable arcs, the per-arc detail behind the thermal_*
      columns carried on silver_grid_ac_line_segment. Declared for completeness:
      no model in this project reads it directly.

sources:

  # ---------------------------------------------------------------------------
  # OUTPUTS — Gold risk overlays and topology tables
  # Source: grid topology + weather data
  # expose: true — consumed by the Grid Resilience dashboard (DT domain)
  # ---------------------------------------------------------------------------

  datasets.ds_dev_gold.grid_wind_risks:
    tags: [ grid, wind, risk, gold, intermediary ]
    dataspace:
      expose: false

  datasets.ds_dev_gold.grid_wind_risks_8h:
    tags: [ grid, wind, risk, gold, intermediary, 8h ]
    dataspace:
      expose: false

  datasets.ds_dev_gold.grid_heat_status:
    tags: [ grid, heat, soil, risk, gold, intermediary ]
    dataspace:
      expose: false

  datasets.ds_dev_gold.grid_heat_risks:
    tags: [ grid, heat, risk, gold, intermediary ]
    dataspace:
      expose: false

  datasets.ds_dev_gold.grid_joint_heat_risks:
    tags: [ grid, heat, thermal, joint, risk, gold, intermediary ]
    dataspace:
      expose: false

  datasets.ds_dev_gold.grid_substations:
    # A distribution operator's network: readable by a reading group of the `dso`
    # organization whose alias is the row's dso_id, so each operator reads only its own.
    row_filters:
      - handler: organization_match
        binds: organization
        args:
          org_type: dso
          column: dso_id
    title: "Secondary Substations — Map Layer (Gold)"
    description: >
      Map-ready GeoJSON for secondary substations (CIM `Substation`), derived from the
      CIM-normalised silver layer. A static infrastructure layer with no weather join,
      carrying `dso_id` so a deployment can scope access per distribution operator.
    tags: [ grid, geo, substations, gold ]
    # One entity per row, so this table needed no reshaping — the mapping spec
    # was already written and simply had nothing pointing at it.
    #
    # CIM, answering CEEDS INT-34, and the second vocabulary in this platform
    # after SOSA. The silver layer is already CIM-shaped
    # (`silver_grid_ac_line_segment` is a cim:ACLineSegment), so this states in
    # the catalogue what the modelling already assumed.
    #
    # `conforms_to` is IEC's namespace. Unlike SOSA's and SAREF's it cannot be
    # dereferenced to check — every CIM IRI answers HTTP 403, CIM being a paid
    # standard — so the terms in the spec are checked against the CIM100 class
    # documentation instead. That is a weaker guarantee, stated rather than
    # hidden: see celine-dev/.agents/ontologies/cim-namespace.md.
    ontology:
      spec: grid_substation
    dcat:
      conforms_to: http://iec.ch/TC57/CIM100#
    expose: true
    dataspace:
      purpose: [GridMonitoring]
      expose: true
      medallion: gold
      contract_required: true
      consent_required: false

  datasets.ds_dev_gold.grid_network_topology:
    # A distribution operator's network: readable by a reading group of the `dso`
    # organization whose alias is the row's dso_id, so each operator reads only its own.
    row_filters:
      - handler: organization_match
        binds: organization
        args:
          org_type: dso
          column: dso_id
    title: "Grid Topology Reference Values (Gold)"
    description: >
      The distinct substations, lines, operational units and municipalities present in the
      CIM `ACLineSegment` interface, on the monthly topology cadence. Read from the silver
      source rather than the daily risk tables so the set stays complete: a line with no
      nearby weather station still appears here, it simply carries no risk rows.
    tags: [ grid, topology, filter, gold ]
    expose: true
    dataspace:
      purpose: [GridMonitoring]
      expose: true
      medallion: gold
      contract_required: true
      consent_required: false

  datasets.ds_dev_gold.grid_shapes:
    # A distribution operator's network: readable by a reading group of the `dso`
    # organization whose alias is the row's dso_id, so each operator reads only its own.
    row_filters:
      - handler: organization_match
        binds: organization
        args:
          org_type: dso
          column: dso_id
    title: "Grid Asset Geometry — Lines and Substations (Gold)"
    description: >
      A unified CIM asset registry carrying geometry only, combining `ACLineSegment`,
      `Substation` and the cable joints of the thermal model so a consumer loads network
      topology once and caches it independently of daily risk updates. Line segments are
      keyed by (line, conductor type, municipality) because the silver layer splits lines at
      administrative boundaries; sub-fragments are merged with `ST_Union`, lengths summed, and
      a segment is flagged as vegetated when any fragment intersects forest. Every asset also
      carries its thermal exposure: for a line the worst tier of its arcs with the minimum
      margin and rating, for a joint the tier of the physical model, `unmodelled` where the
      model does not reach it.
    tags: [ grid, geo, topology, gold ]
    expose: true
    dataspace:
      purpose: [GridMonitoring]
      expose: true
      medallion: gold
      contract_required: true
      consent_required: false

  datasets.ds_dev_gold.grid_tiles:
    # A distribution operator's network: readable by a reading group of the `dso`
    # organization whose alias is the row's dso_id, so each operator reads only its own.
    row_filters:
      - handler: organization_match
        binds: organization
        args:
          org_type: dso
          column: dso_id
    title: "Grid Shape Tile Assignment (Gold)"
    description: >
      A 5 km x 5 km UTM tiling (EPSG:32632) over the extent of the grid shapes, assigning
      every segment to each tile it intersects, for progressive map loading. Segments spanning
      a boundary appear in more than one tile and are deduplicated by segment id downstream.
      Tile coordinates are zero-based from the south-west corner.
    tags: [ grid, geo, tiles, gold, intermediary ]
    expose: true
    dataspace:
      purpose: [GridMonitoring]
      expose: true
      medallion: gold
      contract_required: true
      consent_required: false

  datasets.ds_dev_gold.grid_tile_grid:
    title: "Grid 5 km Tile Grid (Gold)"
    description: >
      The 5 km x 5 km UTM tile grid over the network extent, shared by the segment
      and tree-strike tile indexes so both layers are addressed by the same tile ids.
    tags: [ grid, tiles, gold, intermediary ]
    dataspace:
      expose: false

  datasets.ds_dev_gold.grid_tree_strike_spans:
    # A distribution operator's network: readable by a reading group of the `dso`
    # organization whose alias is the row's dso_id, so each operator reads only its own.
    row_filters:
      - handler: organization_match
        binds: organization
        args:
          org_type: dso
          column: dso_id
    title: "Tree-strike Exposure Spans (Gold)"
    description: >
      The overhead spans of the tree-strike LiDAR analysis as a static map overlay, one
      row per span with its own geometry, exposure tier, strike-tree density and the
      operational unit inherited from the nearest CIM segment of its line. Finer than
      the map tratte, whose tier is the worst intersecting span; exposure only, the wind
      risk escalation is unchanged.
    tags: [ grid, tree_strike, exposure, gold ]
    expose: true
    dataspace:
      purpose: [GridResilience]
      expose: true
      medallion: gold
      contract_required: true
      consent_required: false

  datasets.ds_dev_gold.grid_tree_strike_tiles:
    # A distribution operator's network: readable by a reading group of the `dso`
    # organization whose alias is the row's dso_id, so each operator reads only its own.
    row_filters:
      - handler: organization_match
        binds: organization
        args:
          org_type: dso
          column: dso_id
    title: "Tree-strike Span Tile Index (Gold)"
    description: >
      Tile-to-span mapping on the shared 5 km grid, so the overlay is loaded per
      viewport with the same tile ids as the segments.
    tags: [ grid, tree_strike, tiles, gold ]
    expose: true
    dataspace:
      purpose: [GridResilience]
      expose: true
      medallion: gold
      contract_required: true
      consent_required: false

  datasets.ds_dev_gold.grid_tile_index:
    # A distribution operator's network: readable by a reading group of the `dso`
    # organization whose alias is the row's dso_id, so each operator reads only its own.
    row_filters:
      - handler: organization_match
        binds: organization
        args:
          org_type: dso
          column: dso_id
    title: "Grid Tile Index (Gold)"
    description: >
      One row per tile of the 5 km x 5 km grid, with its bounding box and the number of grid
      segments it contains. The index a consumer reads first, to decide which tiles of the
      asset geometry to fetch.
    tags: [ grid, geo, tiles, gold ]
    expose: true
    dataspace:
      purpose: [GridMonitoring]
      expose: true
      medallion: gold
      contract_required: true
      consent_required: false

  datasets.ds_dev_gold.grid_risks:
    # A distribution operator's network: readable by a reading group of the `dso`
    # organization whose alias is the row's dso_id, so each operator reads only its own.
    row_filters:
      - handler: organization_match
        binds: organization
        args:
          org_type: dso
          column: dso_id
    title: "Grid Wind and Heat Risk by Segment (Gold)"
    description: >
      Wind and heat risk levels per grid asset and day, merged into one table and restricted
      to WARNING and ALERT — NORMAL is excluded at pipeline level. Geometry is deliberately
      absent: join the asset geometry by segment id for it. Where a municipality holds
      sub-fragments at different levels the worst is kept, and vector-specific metrics are
      carried as JSON so a consumer can render them without a per-vector endpoint. Heat is a
      two-axis judgement: the soil temperature of the location crossed with the thermal tier
      of the asset, both readable in the metrics, on the underground tratte and on the cable
      joints (`asset_type` = `joint` in the metrics).
    tags: [ grid, risk, gold ]
    expose: true
    dataspace:
      purpose: [GridResilience]
      expose: true
      medallion: gold
      contract_required: true
      consent_required: false

  datasets.ds_dev_gold.grid_risk_km:
    # A distribution operator's network: readable by a reading group of the `dso`
    # organization whose alias is the row's dso_id, so each operator reads only its own.
    row_filters:
      - handler: organization_match
        binds: organization
        args:
          org_type: dso
          column: dso_id
    title: "Grid Risk Exposure in km by Tratta and Operational Unit (Gold)"
    description: >
      Length-weighted wind and heat risk exposure per tratta (line × municipality × conductor
      type), split by operational unit, per forecast date. Carries km at ALERT / WARNING /
      NORMAL, the static tree-strike and thermal exposure km, and a 0–100 risk index
      (km_alert + half km_warning over the km subject to the vector). Rollups per line and
      per operational unit are exact sums of these rows; used by the tabular view, CSV
      export and the DSO alert e-mail. Cable joints are excluded: a joint has no length, so
      the km table, and with it the alert e-mail, stays a measure of the cable network.
    tags: [ grid, risk, exposure, gold ]
    expose: true
    dataspace:
      purpose: [GridResilience]
      expose: true
      medallion: gold
      contract_required: true
      consent_required: false

  datasets.ds_dev_gold.grid_risks_8h:
    # A distribution operator's network: readable by a reading group of the `dso`
    # organization whose alias is the row's dso_id, so each operator reads only its own.
    row_filters:
      - handler: organization_match
        binds: organization
        args:
          org_type: dso
          column: dso_id
    title: "Grid Wind and Heat Risk by Segment and 8-hour Window (Gold)"
    description: >
      Intra-day companion of grid_risks: WARNING and ALERT levels per grid segment and
      8-hour window (00–08, 08–16, 16–24). Wind is the same model as the daily table on
      the window's max gust excess; heat, a daily forecast, is repeated on the three
      windows of its day. Same segment id, colours and metrics as grid_risks.
    tags: [ grid, risk, gold, 8h ]
    expose: true
    dataspace:
      purpose: [GridResilience]
      expose: true
      medallion: gold
      contract_required: true
      consent_required: false

  datasets.ds_dev_gold.grid_risks_trendline:
    # A distribution operator's network: readable by a reading group of the `dso`
    # organization whose alias is the row's dso_id, so each operator reads only its own.
    row_filters:
      - handler: organization_match
        binds: organization
        args:
          org_type: dso
          column: dso_id
    title: "Daily Grid Risk Ratio by Vector (Gold)"
    description: >
      The share of the relevant network at risk per day and risk vector, as (alert + warning)
      over total segments, with a conductor-type-aware denominator — overhead conductors for
      wind, underground cable for heat. Above 0.65 the day is ALERT, above 0.35 WARNING.
    tags: [ grid, risk, trendline, gold ]
    expose: true
    dataspace:
      purpose: [GridResilience]
      expose: true
      medallion: gold
      contract_required: true
      consent_required: false

  # ---------------------------------------------------------------------------
  # NOWCASTING — Observation-based risk overlays (real-time counterpart)
  # Source: grid topology + om_obs_15min observations
  # ---------------------------------------------------------------------------

  datasets.ds_dev_gold.grid_wind_risks_now:
    tags: [ grid, wind, risk, nowcast, gold, intermediary ]
    dataspace:
      expose: false

  datasets.ds_dev_gold.grid_heat_status_now:
    tags: [ grid, heat, soil, risk, nowcast, gold, intermediary ]
    dataspace:
      expose: false

  datasets.ds_dev_gold.grid_heat_risks_now:
    tags: [ grid, heat, risk, nowcast, gold, intermediary ]
    dataspace:
      expose: false

  datasets.ds_dev_gold.grid_joint_heat_risks_now:
    tags: [ grid, heat, thermal, joint, risk, nowcast, gold, intermediary ]
    dataspace:
      expose: false

  datasets.ds_dev_gold.grid_risks_now:
    # A distribution operator's network: readable by a reading group of the `dso`
    # organization whose alias is the row's dso_id, so each operator reads only its own.
    row_filters:
      - handler: organization_match
        binds: organization
        args:
          org_type: dso
          column: dso_id
    title: "Grid Wind and Heat Risk — Nowcast (Gold)"
    description: >
      The observation-based counterpart of the daily risk table: the same segment, vector,
      level and metrics, plus the observation timestamp. WARNING and ALERT only.
    tags: [ grid, risk, nowcast, gold ]
    expose: true
    dataspace:
      purpose: [GridResilience]
      expose: true
      medallion: gold
      contract_required: true
      consent_required: false

  datasets.ds_dev_gold.v_superset_grid:
    tags: [ grid, superset, gold ]
    dataspace:
      expose: false
