defaults:
  license: null
  ownership:
    - name: rec
      type: DATA_OWNER
  access_level: internal
  access_requirements: partner
  classification: green
  tags: []
  retention_days: 365
  documentation_url: null
  source_system: rec-it
  dcat:
    themes:
      - http://publications.europa.eu/resource/authority/data-theme/ENER
    language_uris:
      - http://publications.europa.eu/resource/authority/language/ENG
    spatial_uris:
      - http://publications.europa.eu/resource/authority/country/ITA
    accrual_periodicity: http://publications.europa.eu/resource/authority/frequency/IRREG
  dataspace:
    odrl_action: use

depends_on:
  - dataset: datasets.*_gold.meters_data_15m
    description: Quarter-hourly meter readings, aggregated per REC member.
  - dataset: datasets.raw.rec_registry_mirror
    description: >
      REC membership. Mirrored into `raw` by a pipeline in this repository —
      it mirrors a private service, which is what makes it look external.

sources:
  # ---------------------------------------------------------------------------
  # OUTPUTS: GSE public open data (Italian national regulatory authority)
  # License: CC-BY 4.0 / Italian Open Data License — publicly available
  # ---------------------------------------------------------------------------

  datasets.ds_dev_gold.gse_cabine_primarie:
    ownership:
      - name: gse
        type: DATA_OWNER
    access_level: open
    # `none` was not in the enum and parsed to nothing; `all` states the grant.
    access_requirements: all
    classification: green
    tags: [geo, primary-substation, gse, open-data, gold]
    expose: true
    dataspace:
      purpose: [EnergyCommunityOperation]
      expose: false

  # ---------------------------------------------------------------------------
  # OUTPUTS: Italian CER virtual consumption (GSE rules)
  # ---------------------------------------------------------------------------

  datasets.ds_dev_gold.rec_virtual_consumption_15m: &rec_community_15m
    title: "Community Virtual Consumption, 15-minute (Gold)"
    description: >
      Fifteen-minute energy accounting for an energy community, at the grain of (timestamp,
      community, primary substation) — netting is per primary substation because sharing cannot
      cross an unconnected cabina primaria, and a community-wide net would invent energy that
      cannot physically flow. Note the column names: total consumption is community grid import
      (prelievo), total production is grid export (immissione), and self-consumption is energy
      collectively shared, not anyone's own self-use.
    tags: [rec, consumption, gold]
    expose: true
    dataspace:
      purpose: [IncentiveCalculation]
      expose: true
      medallion: gold
      contract_required: true
      consent_required: false

  # The same figures, one quantity per row, mapped onto SOSA.
  #
  # Shares the source's governance block by anchor so the two cannot diverge.
  # Note what that inherits here: **no row filter**. The community models have
  # never carried one — a latent cross-community leak the moment a second REC
  # exists, recorded in celine-dev/.agents/celine-pipelines/FACTS.md. This view
  # neither fixes nor widens it, and the anchor means adding a filter to the
  # source covers the view in the same edit.
  datasets.ds_dev_gold.rec_measurements_15m:
    title: "Community Energy Measurements, 15-minute — Observations (Gold)"
    description: >
      The community virtual-consumption figures expressed as one observation per row, the shape
      an observation vocabulary can describe: SOSA, SAREF and CIM each carry one observed
      property per node, so a wide row of four quantities is four observations. The feature of
      interest is the sharing group — a community partition accounted within one regulatory
      zone — rather than the community as a whole.
    <<: *rec_community_15m
    ontology:
      spec: obs_energy_measurement
    dcat:
      conforms_to: http://www.w3.org/ns/sosa/

  datasets.ds_dev_gold.rec_virtual_consumption_hourly:
    tags: [rec, consumption, gold]
    expose: true
    dataspace:
      purpose: [IncentiveCalculation]
      expose: false

  datasets.ds_dev_gold.rec_virtual_consumption_per_device_15m: &rec_per_device_15m
    classification: pii
    tags: [rec, consumption, gold]
    row_filters:
      - handler: rec_registry
        args:
          column: device_id
    expose: true
    dataspace:
      purpose: [IncentiveCalculation]
      expose: false
      medallion: gold
      consent_required: true

  # Per-member allocations, one quantity per row, mapped onto SOSA.
  #
  # This is the binding where the anchor earns its keep. The source is filtered
  # per device — a member sees only their own rows — and the view must be too.
  # Written out separately, the two would be a copy-paste apart from a leak of
  # every member's settlement figures to every other member. Shared by anchor,
  # `row_filters` is one list in this file and the question cannot arise.
  datasets.ds_dev_gold.rec_measurements_per_device_15m:
    classification: pii
    <<: *rec_per_device_15m
    ontology:
      spec: obs_energy_measurement
    dcat:
      conforms_to: http://www.w3.org/ns/sosa/

  datasets.ds_dev_gold.rec_virtual_consumption_per_device_hourly:
    classification: pii
    tags: [rec, consumption, gold]
    row_filters:
      - handler: rec_registry
        args:
          column: device_id
    expose: true
    dataspace:
      purpose: [IncentiveCalculation]
      expose: false
      medallion: gold
      consent_required: true
