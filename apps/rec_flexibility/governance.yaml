defaults:
  license: null
  ownership:
    - name: rec
      type: DATA_OWNER
  access_level: internal
  access_requirements: partner
  classification: green
  tags: []
  retention_days: 365
  documentation_url: null
  source_system: rec-flexibility
  dcat:
    themes:
      - http://publications.europa.eu/resource/authority/data-theme/ENER
    language_uris:
      - http://publications.europa.eu/resource/authority/language/ENG
    spatial_uris:
      - http://publications.europa.eu/resource/authority/country/ITA
    accrual_periodicity: http://publications.europa.eu/resource/authority/frequency/IRREG
  dataspace:
    odrl_action: use

depends_on:
  - dataset: datasets.*_gold.meters_data_15m
    description: Quarter-hourly meter readings, per device.
  - dataset: datasets.*_gold.rec_device_membership
    description: >
      REC membership by device, published by `rec_registry` in this repository: the
      fleet every model computes over.
  - dataset: datasets.*_silver.meters_data
    description: >
      Quarter-hourly readings of EVERY community POD, all meter channels (demo3 metering
      pipeline). The fair gamification reads its M1 channel for the reference groups.
  - dataset: datasets.raw.flexibility_commitments_mirror
    description: >
      Commitments. Mirrored into `raw` by a pipeline in this repository —
      it mirrors a private service, which is what makes it look external.
  - dataset: datasets.*_gold.meters_energy_forecast
    external: true
    description: Per-device forecasts, produced by a deployment's forecasting app.
  - dataset: datasets.*_gold.total_meters_forecast
    external: true
    description: Community-level forecast, produced by a deployment's forecasting app.

# Not declared on purpose, so not served by the dataset-api: rec_settlement_points,
# rec_flexibility_bonus, _rec_device_baselines_raw,
# _rec_device_streaks_raw, silver_flexibility_commitments, and the fair gamification
# intermediates rec_fair_device_registry, rec_fair_meters_15m, rec_fair_daily,
# rec_fair_import_baseline, rec_fair_weekly_metrics. They are intermediate or
# internal tables no reader is meant to reach through the catalogue; their absence here is
# the intended state, not an omission.
#
# Row filters by grain: a device-grain dataset declares `rec_registry` on `device_id`
# (a person sees their own devices); a community-grain dataset declares
# `organization_match` on `community_id` (a reader of a community's organization sees that
# community's rows). Never both on one dataset: filters are ANDed, so a community operator
# with no meter would see nothing.

sources:
  # ---------------------------------------------------------------------------
  # OUTPUTS: Flexibility, gamification and CO2 analytics
  # ---------------------------------------------------------------------------

  datasets.ds_dev_gold.rec_settlement_15m:
    title: "Member Settlement Intervals, 15-minute (Gold)"
    description: >
      One row per member device and fifteen-minute interval, carrying the three energy bases a
      reward can be computed from — grid import, grid export and the behind-the-meter total —
      each already kWh over the interval, annotated with the flexibility window the interval
      falls inside if there is one. Every metered interval is present, not only the committed
      ones: `window_start` is null outside a window, which is what makes the same table serve
      both baseline behaviour and settlement. The population is the metered devices of the
      community. Personal data: a quarter-hour consumption series describes the household
      behind the meter, so a caller sees only the devices the registry entitles them to.
    classification: pii
    tags: [flexibility, settlement, gold]
    row_filters:
      - handler: rec_registry
        args:
          column: device_id
      # Narrowed per person above; the organization layer admits every row.
      - handler: allow_all
        binds: organization
    expose: true
    dataspace:
      purpose: [IncentiveCalculation]
      expose: false
      medallion: gold
      consent_required: true

  datasets.ds_dev_gold.rec_settlement_1h:
    title: "Member Settlement Intervals, Hourly (Gold)"
    description: >
      The quarter-hour settlement intervals summed to the hour, one row per member device and
      hour, with the window context carried forward: `window_start` is non-null when any
      interval in the hour fell inside a flexibility window, and at most one window exists per
      device per hour. This is the grain a settlement reads — how much a device consumed over
      the period it committed to. Same population and same per-device restriction as the
      quarter-hour table it rolls up.
    classification: pii
    tags: [flexibility, settlement, gold]
    row_filters:
      - handler: rec_registry
        args:
          column: device_id
      # Narrowed per person above; the organization layer admits every row.
      - handler: allow_all
        binds: organization
    expose: true
    dataspace:
      purpose: [IncentiveCalculation]
      expose: false
      medallion: gold
      consent_required: true

  datasets.ds_dev_gold.rec_participant_points:
    classification: pii
    tags: [flexibility, gamification, gold]
    row_filters:
      - handler: rec_registry
        args:
          column: device_id
      # Narrowed per person above; the organization layer admits every row.
      - handler: allow_all
        binds: organization
    expose: true
    dataspace:
      purpose: [EnergyCommunityOperation]
      expose: false
      medallion: gold
      consent_required: true

  # Read by the community operator console through the digital twin's manager fetcher
  # (rec_anti_gaming_flags_community), which narrows it to one community and is gated to
  # the community's operators; a person reads only their own devices' flags.
  datasets.ds_dev_gold.rec_anti_gaming_flags:
    classification: pii
    tags: [flexibility, gamification, gold]
    row_filters:
      - handler: rec_registry
        args:
          column: device_id
      # Narrowed per person above; the organization layer admits every row.
      - handler: allow_all
        binds: organization
    expose: true
    dataspace:
      purpose: [EnergyCommunityOperation]
      expose: false
      medallion: gold
      consent_required: true

  datasets.ds_dev_gold.rec_points_leaderboard:
    classification: pii
    tags: [flexibility, gamification, gold]
    row_filters:
      - handler: rec_registry
        args:
          column: device_id
      # Narrowed per person above; the organization layer admits every row.
      - handler: allow_all
        binds: organization
    expose: true
    dataspace:
      purpose: [EnergyCommunityOperation]
      expose: false
      medallion: gold
      consent_required: true

  datasets.ds_dev_gold.rec_flexibility_windows:
    title: "Member Flexibility Window Estimates (Gold)"
    description: >
      One row per member device and community surplus window — the per-device enrichment of the
      community event layer, stating the energy that device could plausibly shift into the
      window and the reward points that would be worth. Estimates are scaled down
      proportionally so the devices sharing a window never together promise more than the
      community surplus available in it, and a device appears only where it has a usable
      forecast inside the window, so an offline meter carries no promise. The population is
      therefore narrower than the fleet. Personal data, restricted per device. Accumulate-only:
      rows derive from the latest forecast generation, so the history is the one the daily runs
      wrote and is not recoverable from source.
    classification: pii
    tags: [flexibility, gold]
    row_filters:
      - handler: rec_registry
        args:
          column: device_id
      # Narrowed per person above; the organization layer admits every row.
      - handler: allow_all
        binds: organization
    expose: true
    dataspace:
      purpose: [FlexibilityResearch]
      expose: false
      medallion: gold
      consent_required: true

  datasets.ds_dev_gold.rec_flexibility_windows_community:
    title: "Community Flexibility Windows (Gold)"
    description: >
      One row per community surplus window — the community-level event layer, where a row
      existing means the opportunity is visible to every member of the community. Per-device
      estimates are not part of this dataset. Accumulate-only: it derives from the latest
      forecast generation, so its history exists through daily incremental runs.
    tags: [flexibility, gold]
    expose: true
    # One community's windows per row: a reader in a community's organization reads that
    # community's windows only. `community_id` is the community's organization alias.
    row_filters:
      - handler: organization_match
        binds: organization
        args:
          column: community_id
      # No person behind these rows: the person layer admits every row.
      - handler: allow_all
        binds: person
    dataspace:
      purpose: [FlexibilityResearch]
      expose: false
      medallion: gold
      contract_required: true
      consent_required: false

  datasets.ds_dev_gold.rec_gamification_summary:
    classification: pii
    tags: [gamification, gold]
    row_filters:
      - handler: rec_registry
        args:
          column: device_id
      # Narrowed per person above; the organization layer admits every row.
      - handler: allow_all
        binds: organization
    expose: true
    dataspace:
      purpose: [EnergyCommunityOperation]
      expose: false
      medallion: gold
      consent_required: true

  datasets.ds_dev_gold.rec_co2_savings:
    classification: pii
    tags: [co2, gold]
    row_filters:
      - handler: rec_registry
        args:
          column: device_id
      # Narrowed per person above; the organization layer admits every row.
      - handler: allow_all
        binds: organization
    expose: true
    dataspace:
      purpose: [EnergyCommunityOperation]
      expose: false
      medallion: gold
      consent_required: true

  datasets.ds_dev_gold.rec_commitment_settlement:
    title: "Flexibility Commitment Settlement (Gold)"
    description: >
      One row per flexibility commitment a member made: the period committed to, the energy
      their meter actually recorded over it, the share of the window's community budget they
      are credited with, the reward points awarded, and the ratio of delivered to promised —
      null until the commitment settles. The allocated share falls back to the raw actual when
      the window has no budget row, and is scaled proportionally when the devices committed to
      one window collectively exceed it. Rejected and cancelled commitments are kept with a
      zero allocation, so acceptance rate and no-shows read from the same table as delivery.
      Personal data: a commitment names a member's device, so a caller sees only the devices
      the registry entitles them to.
    classification: pii
    tags: [flexibility, settlement, gold]
    row_filters:
      - handler: rec_registry
        args:
          column: device_id
      # Narrowed per person above; the organization layer admits every row.
      - handler: allow_all
        binds: organization
    expose: true
    dataspace:
      purpose: [IncentiveCalculation]
      expose: false
      medallion: gold
      consent_required: true

  datasets.ds_dev_gold.rec_co2_savings_community:
    tags: [co2, flexibility, gold]
    expose: true
    row_filters:
      - handler: organization_match
        binds: organization
        args:
          column: community_id
      # No person behind these rows: the person layer admits every row.
      - handler: allow_all
        binds: person
    dataspace:
      purpose: [EnergyCommunityOperation]
      expose: false

  # ---------------------------------------------------------------------------
  # OUTPUTS: Fair gamification (spec 2026-10-07, design 2026-10-09) — weekly Level /
  # Growth / Actions percentiles and the three season boards. Device grain → rec_registry
  # on device_id; community grain → organization_match on community_id.
  # ---------------------------------------------------------------------------

  datasets.ds_dev_gold.rec_fair_season_boards:
    title: "Fair Gamification Season Boards (Gold)"
    description: >
      One row per member device and season: standing in the three boards (Virtuosi = mean
      Level, In crescita = mean Growth, Generale = ½L + ½G + Σ Actions) within the device's
      category, the rank reason when unranked (first week, too few valid weeks, silent,
      quarantined, not in the app, business), weeks counted per board and the season sum of
      weekly points for personal milestones. Means, not sums: data gaps do not penalise.
    classification: pii
    tags: [flexibility, gamification, fair, gold]
    row_filters:
      - handler: rec_registry
        args:
          column: device_id
    expose: true
    dataspace:
      purpose: [EnergyCommunityOperation]
      expose: false
      medallion: gold
      consent_required: true

  datasets.ds_dev_gold.rec_fair_weekly_scores:
    title: "Fair Gamification Weekly Scores (Gold)"
    description: >
      One row per member device and completed ISO week: Level, Growth and Actions points with
      their percentiles, reference group and size, reason codes and the numbers behind them
      (night import share, cloudy days used, night-import change, kept commitments, surplus
      hours) that the app renders as "sei qui perché…". flag_import_rise marks the
      daytime-waste pattern (no points effect).
    classification: pii
    tags: [flexibility, gamification, fair, gold]
    row_filters:
      - handler: rec_registry
        args:
          column: device_id
    expose: true
    dataspace:
      purpose: [EnergyCommunityOperation]
      expose: false
      medallion: gold
      consent_required: true

  datasets.ds_dev_gold.rec_fair_device_class:
    title: "Fair Gamification Device Class per Week (Gold)"
    description: >
      One row per device and week: PV class inferred from the M1 data (export or hidden-PV
      shape, or an operator override), category from the registry member type, quarantine and
      silence flags, and whether the device is rankable that week.
    classification: pii
    tags: [flexibility, gamification, fair, gold]
    row_filters:
      - handler: rec_registry
        args:
          column: device_id
    expose: true
    dataspace:
      purpose: [EnergyCommunityOperation]
      expose: false
      medallion: gold
      consent_required: true

  datasets.ds_dev_gold.rec_fair_commitment_outcomes:
    title: "Fair Gamification Commitment Outcomes (Gold)"
    description: >
      One row per commitment: the community window it overlapped, the import measured over
      the commitment against the device's own baseline, whether it was kept (≥ 110%), the fixed
      points earned and the true-surplus hours inside it. 'no_window' means not evaluable,
      never missed.
    classification: pii
    tags: [flexibility, gamification, fair, gold]
    row_filters:
      - handler: rec_registry
        args:
          column: device_id
    expose: true
    dataspace:
      purpose: [EnergyCommunityOperation]
      expose: false
      medallion: gold
      consent_required: true

  datasets.ds_dev_gold.rec_fair_anti_gaming_flags:
    title: "Fair Gamification Anti-Gaming Flags (Gold)"
    description: >
      One row per flagged device-week. F1_IMPORT_RISE: total import above 130% of the device's
      own 8-week median while its night share fell (daytime waste). Informational.
    classification: pii
    tags: [flexibility, gamification, fair, gold]
    row_filters:
      - handler: rec_registry
        args:
          column: device_id
    expose: true
    dataspace:
      purpose: [EnergyCommunityOperation]
      expose: false
      medallion: gold
      consent_required: true

  datasets.ds_dev_gold.rec_fair_community_days:
    title: "Fair Gamification Community Days (Gold)"
    description: >
      One row per community and local day: total M1 export of the valid, non-quarantined PODs,
      how many reported, and the causal cloudy-day flag (export at or below the 30th percentile
      of the 28 days ending on the week's Sunday).
    tags: [flexibility, gamification, fair, gold]
    expose: true
    row_filters:
      - handler: organization_match
        args:
          column: community_id
    dataspace:
      purpose: [EnergyCommunityOperation]
      expose: false
      medallion: gold
      consent_required: false

  datasets.ds_dev_gold.rec_fair_surplus_hours:
    title: "Fair Gamification True-Surplus Hours (Gold)"
    description: >
      One row per scope (primary substation with at least 6 reporting PODs, or the whole
      community) and hour: M1 export vs import of its non-quarantined PODs and whether the hour
      was in true surplus.
    tags: [flexibility, gamification, fair, gold]
    expose: true
    row_filters:
      - handler: organization_match
        args:
          column: community_id
    dataspace:
      purpose: [EnergyCommunityOperation]
      expose: false
      medallion: gold
      consent_required: false
