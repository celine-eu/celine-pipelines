defaults:
  license: null
  ownership:
    - name: rec
      type: DATA_OWNER
  access_level: internal
  access_requirements: partner
  classification: green
  tags: []
  retention_days: 365
  documentation_url: null
  source_system: rec-flexibility
  dcat:
    themes:
      - http://publications.europa.eu/resource/authority/data-theme/ENER
    language_uris:
      - http://publications.europa.eu/resource/authority/language/ENG
    spatial_uris:
      - http://publications.europa.eu/resource/authority/country/ITA
    accrual_periodicity: http://publications.europa.eu/resource/authority/frequency/IRREG
  dataspace:
    odrl_action: use

depends_on:
  - dataset: datasets.*_gold.meters_data_15m
    description: Quarter-hourly meter readings, per device.
  - dataset: datasets.raw.flexibility_commitments_mirror
    description: >
      Commitments. Mirrored into `raw` by a pipeline in this repository —
      it mirrors a private service, which is what makes it look external.
  - dataset: datasets.*_gold.meters_energy_forecast
    external: true
    description: Per-device forecasts, produced by a deployment's forecasting app.
  - dataset: datasets.*_gold.total_meters_forecast
    external: true
    description: Community-level forecast, produced by a deployment's forecasting app.

sources:
  # ---------------------------------------------------------------------------
  # OUTPUTS: Flexibility, gamification and CO2 analytics
  # ---------------------------------------------------------------------------

  datasets.ds_dev_gold.rec_settlement_15m:
    title: "Member Settlement Intervals, 15-minute (Gold)"
    description: >
      One row per member device and fifteen-minute interval, carrying the three energy bases a
      reward can be computed from — grid import, grid export and the behind-the-meter total —
      each already kWh over the interval, annotated with the flexibility window the interval
      falls inside if there is one. Every metered interval is present, not only the committed
      ones: `window_start` is null outside a window, which is what makes the same table serve
      both baseline behaviour and settlement. The population is the metered devices of the
      community. Personal data: a quarter-hour consumption series describes the household
      behind the meter, so a caller sees only the devices the registry entitles them to.
    classification: pii
    tags: [flexibility, settlement, gold]
    row_filters:
      - handler: rec_registry
        args:
          column: device_id
    expose: true
    dataspace:
      purpose: [IncentiveCalculation]
      expose: false
      medallion: gold
      consent_required: true

  datasets.ds_dev_gold.rec_settlement_1h:
    title: "Member Settlement Intervals, Hourly (Gold)"
    description: >
      The quarter-hour settlement intervals summed to the hour, one row per member device and
      hour, with the window context carried forward: `window_start` is non-null when any
      interval in the hour fell inside a flexibility window, and at most one window exists per
      device per hour. This is the grain a settlement reads — how much a device consumed over
      the period it committed to. Same population and same per-device restriction as the
      quarter-hour table it rolls up.
    classification: pii
    tags: [flexibility, settlement, gold]
    row_filters:
      - handler: rec_registry
        args:
          column: device_id
    expose: true
    dataspace:
      purpose: [IncentiveCalculation]
      expose: false
      medallion: gold
      consent_required: true

  datasets.ds_dev_gold.rec_participant_points:
    classification: pii
    tags: [flexibility, gamification, gold]
    row_filters:
      - handler: rec_registry
        args:
          column: device_id
    expose: true
    dataspace:
      purpose: [EnergyCommunityOperation]
      expose: false
      medallion: gold
      consent_required: true

  datasets.ds_dev_gold.rec_points_leaderboard:
    classification: pii
    tags: [flexibility, gamification, gold]
    row_filters:
      - handler: rec_registry
        args:
          column: device_id
    expose: true
    dataspace:
      purpose: [EnergyCommunityOperation]
      expose: false
      medallion: gold
      consent_required: true

  datasets.ds_dev_gold.rec_flexibility_windows:
    title: "Member Flexibility Window Estimates (Gold)"
    description: >
      One row per member device and community surplus window — the per-device enrichment of the
      community event layer, stating the energy that device could plausibly shift into the
      window and the reward points that would be worth. Estimates are scaled down
      proportionally so the devices sharing a window never together promise more than the
      community surplus available in it, and a device appears only where it has a usable
      forecast inside the window, so an offline meter carries no promise. The population is
      therefore narrower than the fleet. Personal data, restricted per device. Accumulate-only:
      rows derive from the latest forecast generation, so the history is the one the daily runs
      wrote and is not recoverable from source.
    classification: pii
    tags: [flexibility, gold]
    row_filters:
      - handler: rec_registry
        args:
          column: device_id
    expose: true
    dataspace:
      purpose: [FlexibilityResearch]
      expose: false
      medallion: gold
      consent_required: true

  datasets.ds_dev_gold.rec_flexibility_windows_community:
    title: "Community Flexibility Windows (Gold)"
    description: >
      One row per community surplus window — the community-level event layer, where a row
      existing means the opportunity is visible to every member of the community. Per-device
      estimates are not part of this dataset. Accumulate-only: it derives from the latest
      forecast generation, so its history exists through daily incremental runs.
    tags: [flexibility, gold]
    expose: true
    dataspace:
      purpose: [FlexibilityResearch]
      expose: true
      medallion: gold
      contract_required: true
      consent_required: false

  datasets.ds_dev_gold.rec_gamification_summary:
    classification: pii
    tags: [gamification, gold]
    row_filters:
      - handler: rec_registry
        args:
          column: device_id
    expose: true
    dataspace:
      purpose: [EnergyCommunityOperation]
      expose: false
      medallion: gold
      consent_required: true

  datasets.ds_dev_gold.rec_co2_savings:
    classification: pii
    tags: [co2, gold]
    row_filters:
      - handler: rec_registry
        args:
          column: device_id
    expose: true
    dataspace:
      purpose: [EnergyCommunityOperation]
      expose: false
      medallion: gold
      consent_required: true

  datasets.ds_dev_gold.rec_commitment_settlement:
    title: "Flexibility Commitment Settlement (Gold)"
    description: >
      One row per flexibility commitment a member made: the period committed to, the energy
      their meter actually recorded over it, the share of the window's community budget they
      are credited with, the reward points awarded, and the ratio of delivered to promised —
      null until the commitment settles. The allocated share falls back to the raw actual when
      the window has no budget row, and is scaled proportionally when the devices committed to
      one window collectively exceed it. Rejected and cancelled commitments are kept with a
      zero allocation, so acceptance rate and no-shows read from the same table as delivery.
      Personal data: a commitment names a member's device, so a caller sees only the devices
      the registry entitles them to.
    classification: pii
    tags: [flexibility, settlement, gold]
    row_filters:
      - handler: rec_registry
        args:
          column: device_id
    expose: true
    dataspace:
      purpose: [IncentiveCalculation]
      expose: false
      medallion: gold
      consent_required: true

  datasets.ds_dev_gold.rec_co2_savings_community:
    tags: [co2, flexibility, gold]
    expose: true
    dataspace:
      purpose: [EnergyCommunityOperation]
      expose: false
