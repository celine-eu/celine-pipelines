          select d as device_id, 'rec' as community_id, w::date as week_start, date '2026-09-01' as season_start, true as is_valid_week,
                 50.0::double precision as level_points, 50.0::double precision as growth_points, null::text as growth_reason, 0 as actions_points, 100.0::double precision as weekly_points
          from unnest(array['ok', 'sil', 'qua', 'biz', 'out']) as d cross join generate_series(date '2026-09-07', date '2026-09-14', interval '7 days') as w
