      rows: []

  - name: cw2_nine_consecutive_hours_produce_three_subwindows
    description: Nine consecutive surplus hours must be sliced into 3 × 3h sub-windows (MAX_WINDOW_HOURS).
    model: rec_flexibility_windows_community
    overrides:
      macros:
        is_incremental: false
    given:
      - input: source('meters_gold', 'total_meters_forecast')
        rows:
          - {community_id: 'example-rec', timestamp: '2024-06-01 06:00:00', net_exchange_kwh: 1.0, period: 'forecast'}
          - {community_id: 'example-rec', timestamp: '2024-06-01 07:00:00', net_exchange_kwh: 1.0, period: 'forecast'}
          - {community_id: 'example-rec', timestamp: '2024-06-01 08:00:00', net_exchange_kwh: 1.0, period: 'forecast'}
          - {community_id: 'example-rec', timestamp: '2024-06-01 09:00:00', net_exchange_kwh: 1.0, period: 'forecast'}
          - {community_id: 'example-rec', timestamp: '2024-06-01 10:00:00', net_exchange_kwh: 1.0, period: 'forecast'}
