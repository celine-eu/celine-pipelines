          - {device_id: 'sil', community_id: 'rec', week_start: '2026-09-14', category: 'household', pv_class: 'no_pv', ref_group: 'household/no_pv', is_in_app: true,  is_quarantined: false, is_silent: true}
          - {device_id: 'qua', community_id: 'rec', week_start: '2026-09-14', category: 'household', pv_class: 'no_pv', ref_group: 'household/no_pv', is_in_app: true,  is_quarantined: true,  is_silent: false}
          - {device_id: 'biz', community_id: 'rec', week_start: '2026-09-14', category: 'business',  pv_class: 'no_pv', ref_group: 'business/no_pv',  is_in_app: true,  is_quarantined: false, is_silent: false}
