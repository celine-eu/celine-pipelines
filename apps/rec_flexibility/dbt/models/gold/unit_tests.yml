      - input: source('rec_registry_gold', 'rec_device_membership')
        rows:
          - {community_id: 'big', device_id: 'dev-a', role: 'consumer', member_type: 'schema:Person', substation_id: 'S1'}
          - {community_id: 'big', device_id: 'dev-b', role: 'consumer', member_type: 'schema:Person', substation_id: 'S1'}
