name: Updae CELINE docs

on:
    push:
        branches: [main]
        paths:
            # Must match the `paths:` block for this repo in
            # celine-eu.github.io/repos.yaml — those are the files the site
            # fetches, and anything it fetches has to be able to trigger a
            # rebuild. `docs/**` was missing here, so documentation-only
            # changes were published to a site that never rebuilt.
            - "README.md"
            - "apps/*/README.md"
            - "docs/**"

jobs:
    notify:
        runs-on: ubuntu-latest

        steps:
            - name: Trigger website rebuild
              uses: peter-evans/repository-dispatch@v4
              with:
                  token: ${{ secrets.CELINE_WEBSITE_TOKEN }}
                  repository: celine-eu/celine-eu.github.io
                  event-type: celine-docs-update
                  client-payload: |
                      {
                        "source_repo": "${{ github.repository }}",
                        "ref": "${{ github.ref }}",
                        "sha": "${{ github.sha }}"
                      }
